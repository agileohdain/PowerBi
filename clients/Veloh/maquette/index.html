<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOH — Pilotage de flotte cyclable</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --primary:#B69E7F;
    --surface:#FFFFFF;
    --canvas:#F1F5F9;
    --border:#CBD5E1;
    --card-bg:#FFFFFF;
    --text-primary:#0F172A;
    --text-secondary:#64748B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0B1220;font-family:Inter,system-ui,-apple-system,sans-serif;}
  #vueport{position:fixed;inset:0;overflow:hidden;}
  .slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;background:var(--canvas);}

  /* Header trapezoids */
  .banner{position:absolute;left:0;top:0;height:97px;width:100%;background:var(--primary);
    clip-path:polygon(342px 0,100% 0,100% 97px,267px 97px);}
  .logo-zone{position:absolute;left:0;top:0;height:97px;width:342px;background:var(--surface);
    clip-path:polygon(0 0,320px 0,244px 97px,0 97px);
    display:flex;align-items:center;justify-content:center;padding-right:36px;}
  .logo-zone img{max-height:64px;max-width:210px;object-fit:contain;}

  /* Title overlay */
  .head-text{position:absolute;top:0;height:97px;left:360px;right:48px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:var(--surface);}
  .head-text h1{font-size:30px;font-weight:700;letter-spacing:1px;line-height:1.05;}
  .head-text .sub{font-size:13px;opacity:.9;margin-top:3px;}

  /* Info button */
  .info-wrap{position:absolute;top:30px;right:16px;z-index:70;}
  .info-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--primary);
    display:inline-flex;align-items:center;justify-content:center;font-family:serif;font-size:20px;font-weight:800;
    cursor:help;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .info-wrap .popover{position:absolute;top:40px;right:-12px;width:400px;display:none;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:16px;z-index:80;}
  .info-wrap:hover .popover{display:block;}
  .pop-page{text-transform:uppercase;color:var(--primary);font-weight:700;font-size:12px;letter-spacing:.5px;}
  .pop-title{font-size:15px;font-weight:700;color:var(--text-primary);margin-top:2px;}
  .pop-desc{font-size:12px;color:var(--text-secondary);margin-top:4px;}
  .pop-div{height:1px;background:var(--border);margin:10px 0;}
  .pop-sub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);padding:4px 0;}
  .pop-sub.active{color:var(--text-primary);font-weight:600;}
  .pop-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .pop-dot.blue{background:#2563EB;}
  .pop-dot.prim{background:var(--primary);}

  /* Filter pane */
  .pane{position:absolute;left:11px;top:116px;width:235px;bottom:40px;background:var(--surface);
    border-radius:10px;padding:16px;overflow:hidden;display:flex;flex-direction:column;}
  .pane-head{display:flex;align-items:center;gap:8px;color:var(--primary);font-weight:600;font-size:14px;margin-bottom:12px;}
  .pane-head svg{stroke:var(--primary);}
  .pane-active-badge{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:10px;height:16px;}
  .pane::-webkit-scrollbar{width:6px;}
  .pane::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);margin:10px 0 6px;}
  .chiclets{display:flex;flex-wrap:wrap;gap:6px;}
  .chic{flex:1;text-align:center;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;
    background:var(--canvas);color:var(--text-secondary);border:1px solid var(--border);transition:all .15s;}
  .chic.active{background:var(--primary);color:var(--surface);border-color:var(--primary);font-weight:600;}
  .dd-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--surface);
    border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-primary);cursor:pointer;}
  .dd-menu{position:absolute;z-index:50;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;
    margin-top:4px;box-shadow:0 6px 16px rgba(0,0,0,.14);max-height:150px;overflow:auto;}
  .dd-item{padding:6px 10px;font-size:12px;color:var(--text-primary);cursor:pointer;}
  .dd-item:hover{background:var(--canvas);}
  .dd-item.active{background:var(--primary);color:var(--surface);}
  .dd-wrap{position:relative;}
  .range-row{display:flex;gap:6px;margin-top:4px;}
  .range-row input{width:100%;padding:5px 6px;border:1px solid var(--border);border-radius:5px;font-size:11px;color:var(--text-primary);background:var(--surface);}
  .slider-wrap{position:relative;height:22px;margin-top:6px;}
  .slider-wrap input[type=range]{position:absolute;width:100%;pointer-events:none;-webkit-appearance:none;appearance:none;background:transparent;height:22px;}
  .slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--surface);
    border:2px solid var(--primary);pointer-events:auto;cursor:pointer;}
  .slider-track{position:absolute;top:9px;left:0;right:0;height:4px;background:var(--border);border-radius:2px;}
  .slider-fill{position:absolute;top:9px;height:4px;background:var(--primary);border-radius:2px;}
  .clear-btn{margin-top:14px;width:100%;padding:8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
    background:var(--surface);color:var(--text-secondary);border:1px solid var(--border);transition:all .15s;text-align:center;}
  .clear-btn:hover{background:var(--canvas);color:var(--text-primary);border-color:var(--primary);}

  /* Content */
  .content{position:absolute;left:262px;top:97px;right:0;bottom:40px;padding:0 20px 0 16px;display:flex;flex-direction:column;box-sizing:border-box;}
  .nav-l1{display:flex;gap:10px;margin-bottom:12px;}
  .nav-pill{flex:1;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;
    font-weight:500;color:var(--text-secondary);text-align:center;cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .nav-pill.active{background:var(--primary);color:var(--surface);font-weight:600;border-color:var(--primary);}
  .nav-l2{display:flex;align-items:center;gap:24px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .nav-link{font-size:12px;font-weight:500;color:var(--text-secondary);background:transparent;border:0;padding:2px 0;cursor:pointer;}
  .nav-link:hover{color:var(--text-primary);}
  .nav-link.active{color:var(--primary);font-weight:600;border-bottom:2px solid var(--primary);padding-bottom:4px;}

  .kpi-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;margin-bottom:12px;min-height:118px;}
  .kpi-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px 14px 12px;position:relative;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:0;}
  .kpi-card.consolidation{border:2px dashed #FF0000;}
  .kpi-accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);}
  .kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-value{font-size:30px;font-weight:700;color:var(--text-primary);letter-spacing:-.5px;margin:4px 0 2px;white-space:nowrap;}
  .kpi-trend{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600;width:max-content;}
  .trend-up{background:#DCFCE7;color:#166534;border:1px solid #BBF7D0;}
  .trend-down{background:#FFE4E6;color:#9F1239;border:1px solid #FECDD3;}
  .kpi-consol-pill{margin-top:6px;display:inline-flex;align-items:center;font-size:9px;font-weight:700;text-transform:uppercase;
    letter-spacing:.4px;color:#FF0000;background:rgba(255,0,0,.08);padding:2px 6px;border-radius:5px;width:max-content;}

  .vis-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;}
  .vis-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:12px 12px 8px;display:flex;flex-direction:column;min-height:0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .vis-card.full{grid-column:1 / -1;}
  .vis-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .vis-title{font-size:13px;font-weight:600;color:var(--text-primary);}
  .vis-sub{font-size:11px;color:var(--text-secondary);font-weight:400;}
  .chart-holder{position:relative;flex:1;min-height:0;}
  .chart-holder .chart-echarts{position:absolute;inset:0;}
  .donut-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
    pointer-events:none;line-height:1;text-align:center;z-index:5;}
  .donut-center .dc-value{font-size:19px;font-weight:700;color:var(--text-primary);}
  .donut-center .dc-sub{font-size:10px;color:var(--text-secondary);margin-top:3px;}

  .footer{position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--canvas);border-top:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary);}
</style>
</head>

      </div>

      <div class="lbl">Plage de dates</div>
      <div class="range-row">
        <input type="text" id="dateStart" value="" onchange="dateInput('start')">
        <input type="text" id="dateEnd" value="" onchange="dateInput('end')">
      </div>
      <div class="slider-wrap">
        <div class="slider-track"></div>
        <div class="slider-fill" id="fillBar"></div>
        <input type="range" id="rangeStart" min="0" max="18" value="0" oninput="rangeMove('start')">
        <input type="range" id="rangeEnd" min="0" max="18" value="18" oninput="rangeMove('end')">
      </div>

      <div class="clear-btn" onclick="clearFilters()">✕ Effacer tous les filtres</div>
    </div>

    <!-- Main content -->
    <div class="content" id="content"></div>

    <div class="footer">Données fictives — Maquette haute-fidélité Power BI.</div>
  </div>
</div>

/* ============================ FILTER ENGINE ============================ */
function monthPass(i){
  const m = MONTH_META[i];
  if (FILT.years.size && !FILT.years.has(m.year)) return false;
  if (FILT.quarter && m.quarter!==FILT.quarter) return false;
  if (FILT.month && m.month!==FILT.month) return false;
  return i>=FILT.start && i<=FILT.end;
}
function isFiltered(){ return FILT.years.size>0||FILT.quarter>0||FILT.month>0||FILT.start>0||FILT.end<N_MONTHS-1; }
function monthIdx(y,m){ return (y-2024)*12 + (m-1); }

function aggregates(){
  const agg = {
    km:0, rides:0, min:0,
    acts:0, cActifs:0, pActifs:0,
    cKm:0,pKm:0, cRides:0,pRides:0, cMin:0,pMin:0,
    periodMask:0, priorMask:0, hasYoY:false,
    kmPays:{}, kmVille:{}, kmMarque:{}, topVille:[], topMarque:[]
  };
  let cur = [], pri = [];
  for (let i=0;i<N_MONTHS;i++){
    if (!monthPass(i)) continue;
    agg.km+=KM_M[i]; agg.rides+=RIDES_M[i]; agg.min+=MIN_M[i];
    agg.periodMask |= (1<<i);
    if (i>=12){ cur.push(i); pri.push(i-12); agg.hasYoY=true; agg.cKm+=KM_M[i]; agg.pKm+=KM_M[i-12];
      agg.cRides+=RIDES_M[i]; agg.pRides+=RIDES_M[i-12]; agg.cMin+=MIN_M[i]; agg.pMin+=MIN_M[i-12]; }
  }
  for (const p of Object.keys(KM_PAYS)){ let s=0; for(let i=0;i<N_MONTHS;i++) if(monthPass(i)) s+=KM_PAYS[p][i]; agg.kmPays[p]=s; }
  for (const v of Object.keys(KM_VILLE)){ let s=0; for(let i=0;i<N_MONTHS;i++) if(monthPass(i)) s+=KM_VILLE[v][i]; agg.kmVille[v]=s; }
  for (const m of Object.keys(KM_MARQUE)){ let s=0; for(let i=0;i<N_MONTHS;i++) if(monthPass(i)) s+=KM_MARQUE[m][i]; agg.kmMarque[m]=s; }
  agg.topVille = Object.keys(agg.kmVille).map(k=>({name:k,value:agg.kmVille[k]})).sort((a,b)=>b.value-a.value);
  agg.topMarque = Object.keys(agg.kmMarque).map(k=>({name:k,value:agg.kmMarque[k]})).sort((a,b)=>b.value-a.value);
  // active cyclists (bitmask) current period
  for (const mask of ACT_MASKS) if (mask & agg.periodMask) agg.acts++;
  // YoY actifs on matched comparable months
  let curMask=0, priMask=0;
  for (const i of cur) curMask |= (1<<i);
  for (const i of pri) priMask |= (1<<i);
  for (const mask of ACT_MASKS){ if (mask & curMask) agg.cActifs++; if (mask & priMask) agg.pActifs++; }
  return agg;
}

/* ============================ HELPERS ============================ */
const fmtInt = n => { if(!isFinite(n)) return '—'; return Math.round(n).toLocaleString('fr-FR'); };
const fmt1 = n => { if(!isFinite(n)) return '—'; return n.toLocaleString('fr-FR',{maximumFractionDigits:1}); };
const hmm = m => { const h=Math.floor(m/60), mm=Math.round(m%60); return h>0 ? h+'h '+String(mm).padStart(2,'0') : mm+' min'; };
function dynTrend(k, agg){
  // k: [cur, prior] current and prior base values for the YoY
  const c=k[0], p=k[1];
  return (p && p>0 && c!==null) ? (c-p)/p*100 : null;
}
function trendBlock(trend){
  if (trend===null) return '';
  const up = trend>=0;
  const cls = up ? 'trend-up' : 'trend-down';
  const sign = up ? '+' : '−';
  return `<span class="kpi-trend ${cls}">${sign}${Math.abs(trend).toLocaleString('fr-FR',{maximumFractionDigits:1})} % vs N-1</span>`;
}
function kpiCard(label, value, trend, consolidation, overrideCls){
  let extra='', pill='';
  if (consolidation){ extra=' consolidation'; }
  if (consolidation) pill = `<div class="kpi-consol-pill">Indicateur en consolidation</div>`;
  return `<div class="kpi-card${extra} ${overrideCls||''}">
    <div class="kpi-accent"></div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${trendBlock(trend)}
    ${pill}
  </div>`;
}

/* ECharts color resolution */
const P = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#B69E7F';
const TP = getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim() || '#0F172A';

function baseOption(){
  return { backgroundColor:'transparent', fontFamily:'Inter, system-ui, sans-serif',
    textStyle:{color:TP, fontSize:12},
    tooltip:{trigger:'axis',backgroundColor:'#ffffff',borderColor:PR,borderWidth:1,padding:[8,12],
      textStyle:{color:'#0f172a',fontSize:12}, extraCssText:'box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border-radius:6px;'},
    grid:{top:30,right:20,bottom:26,left:44,containLabel:false} };
}
function axisX(labels){ return { type:'category', data:labels, axisLine:{lineStyle:{color:'#94a3b8'}},
  axisTick:{show:false}, axisLabel:{color:TS,fontSize:10} }; }
function axisY(){ return { type:'value', axisLine:{show:false}, axisTick:{show:false},
  axisLabel:{color:TS,fontSize:10}, splitLine:{lineStyle:{color:'#e2e8f0',type:'dashed'}} }; }

function lineChart(labels, series, isArea){
  const lineSeries = series.map((s,i)=>({ name:s.name, type:'line', data:s.data, smooth:0.2, symbol:'circle', symbolSize:6,
    lineStyle:{width:2.5,color:s.color||PAL[i%PAL.length]},
    itemStyle:{color:s.color||PAL[i%PAL.length],borderWidth:2,borderColor:'#fff'},
    areaStyle:isArea!==false?{opacity:0.12,color:s.color||PAL[i%PAL.length]}:undefined }));
  const n = series.reduce((a,s)=>a.concat(s.data),[]).filter(v=>v!==null&&v!==undefined);
  return Object.assign(baseOption(),{ legend:series.length>1?{top:0,right:0,textStyle:{color:TS,fontSize:10},icon:'circle',itemWidth:8,itemHeight:8}:undefined,
    tooltip:{trigger:'axis'}, xAxis:axisX(labels), yAxis:axisY(), series:lineSeries });
}
function barChart(labels, data, color){
  return Object.assign(baseOption(),{ tooltip:{trigger:'axis'},
    xAxis:axisX(labels), yAxis:axisY(),
    series:[{ name:'Valeur', type:'bar', data, barMaxWidth:24, color:color||P,
      label:{show:true,position:'top',fontSize:9,color:'#334155',formatter:(p)=>fmtInt(p.value)},
      itemStyle:{borderRadius:[3,3,0,0]} }] });
}
function hbarChart(items, colorArr){
  return Object.assign(baseOption(),{ tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
    xAxis:{type:'value',axisLine:{show:false},axisTick:{show:false},axisLabel:{color:TS,fontSize:10},splitLine:{lineStyle:{color:'#e2e8f0',type:'dashed'}}},
    yAxis:{type:'category',data:items.map(d=>d.name),axisLine:{lineStyle:{color:'#94a3b8'}},axisTick:{show:false},axisLabel:{color:TP,fontSize:10}},
    series:[{ type:'bar', data:items.map((d,idx)=>({value:Math.round(d.value), itemStyle:{color:(colorArr||PAL)[idx%(colorArr||PAL).length],borderRadius:[0,4,4,0]}})),
      barWidth:15, label:{show:true,position:'right',fontSize:10,fontWeight:'bold',color:'#0f172a',distance:6,formatter:(p)=>Math.round(p.value).toLocaleString('fr-FR')} }] });
}
function donutChart(items, centerColor){
  const opt = Object.assign(baseOption(),{ tooltip:{trigger:'item'},
    color:PAL,
    series:[{ type:'pie', radius:['56%','76%'], center:['50%','50%'],
      data:items.map(d=>({name:d.name,value:d.value})),
      label:{show:true,formatter:'{b}\n{c}',fontSize:10,color:TS,lineHeight:13},
      labelLine:{length:8,length2:8},
      itemStyle:{borderRadius:4,borderColor:'#fff',borderWidth:2} }] });
  return opt;
}

function makeChart(id, option){
  const el = document.getElementById(id);
  if (!el || !el.__chart) return;
  if (window.echarts){
    if (chartRegistry[id]){ try{ chartRegistry[id].dispose(); }catch(e){} }
    chartRegistry[id] = echarts.init(el);
    chartRegistry[id].setOption(option);
  }
}

      makeChart('ch-1-0-3', lineChart(labels,[{name:'Km',data:KM_M.filter((_,i)=>monthPass(i)),color:P}],true));
      makeChart('ch-1-0-4', hbarChart(agg.topMarque.slice(0,6),PAL));
    });
  },

  /* ---- P2 S2 Répartition par marque ---- */
  "1-1": function(agg){
    const dominant = Object.keys(VELOS_MARQUE).sort((a,b)=>VELOS_MARQUE[b]-VELOS_MARQUE[a])[0];
    const kpis = [
      kpiCard('Vélos par marque', fmtInt(VELOS_MARQUE[dominant]), null, false),
      kpiCard('Marque dominante', dominant, null, false)
    ].join('');
    const velosMarque = Object.keys(VELOS_MARQUE).map(k=>({name:k,value:VELOS_MARQUE[k]})).sort((a,b)=>b.value-a.value).slice(0,8);
    const marqueKm = agg.topMarque.slice(0,7);
    const topBrands = Object.keys(VELOS_MARQUE).sort((a,b)=>VELOS_MARQUE[b]-VELOS_MARQUE[a]).slice(0,5);
    const labels=MONTH_LABELS.filter((_,i)=>monthPass(i));
    const ser = topBrands.map((b,i)=>({name:b,data:KM_MARQUE[b].filter((_,j)=>monthPass(j)),color:PAL[i%PAL.length]}));

    const vis =
    `<div class="kpi-row">${kpis}</div>
    <div class="vis-grid">
      <div class="vis-card"><div class="vis-head"><div class="vis-title">Parc par marque</div><div class="vis-sub">top 8</div></div><div class="chart-holder"><div class="chart-echarts" id="ch-1-1-1"></div></div></div>
      <div class="vis-card"><div class="vis-head"><div class="vis-title">Évolution km par marque</div><div class="vis-sub">top 5, km/mois</div></div><div class="chart-holder"><div class="chart-echarts" id="ch-1-1-2"></div></div></div>
      <div class="vis-card"><div class="vis-head"><div class="vis-title">Kilométrage par marque</div><div class="vis-sub">top 7, km</div></div><div class="chart-holder"><div class="chart-echarts" id="ch-1-1-3"></div></div></div>
      <div class="vis-card"><div class="vis-head"><div class="vis-title">Kilomètres par mois</div><div class="vis-sub">km</div></div><div class="chart-holder"><div class="chart-echarts" id="ch-1-1-4"></div></div></div>
    </div>`;
    document.getElementById('content').innerHTML = vis;
    requestAnimationFrame(()=>{
      makeChart('ch-1-1-1', hbarChart(velosMarque,PAL));
      makeChart('ch-1-1-2', lineChart(labels,ser,false));
      makeChart('ch-1-1-3', hbarChart(marqueKm,PAL));
      makeChart('ch-1-1-4', lineChart(labels,[{name:'Km',data:KM_M.filter((_,i)=>monthPass(i)),color:P}],true));
    });
  }
};

/* ============================ NAV & RENDER ============================ */
function renderNav(){
  const c = document.getElementById('content');
  const page = NAV[STATE.page];
  const l1 = NAV.map((p,pi)=>
    `<div class="nav-pill ${pi===STATE.page?'active':''}" onclick="go(${pi},0)">${p.name}</div>`).join('');
  const l2 = page.subs.map((s,si)=>
    `<button class="nav-link ${si===STATE.sub?'active':''}" onclick="go(${STATE.page},${si})">${s.name}</button>`).join('');
  const navHtml = `<div class="nav-l1">${l1}</div><div class="nav-l2">${l2}</div>`;
  c.innerHTML = navHtml + (c.innerHTML || '');
  renderInfo();
}
function renderInfo(){
  const page = NAV[STATE.page], sub = page.subs[STATE.sub];
  const subsHtml = page.subs.map((s,i)=>`
    <div class="pop-sub ${i===STATE.sub?'active':''}">
      <span class="pop-dot ${i===STATE.sub?'blue':'prim'}"></span>
      <div><strong>${s.name}</strong>${i===STATE.sub?' (sous-page sélectionnée)':''}<br>${s.desc}</div>
    </div>`).join('');
  document.getElementById('infoPop').innerHTML = `
    <div class="pop-page">${page.name}</div>
    <div class="pop-title">${sub.name}</div>
    <div class="pop-desc">${sub.desc}</div>
    <div class="pop-div"></div>
    ${subsHtml}`;
}
function renderPage(){
  const c = document.getElementById('content');
  c.innerHTML = '';
  const agg = aggregates();
  const key = STATE.page+'-'+STATE.sub;
  if (VIEWS[key]) VIEWS[key](agg);
  else VIEWS['0-0'](agg);
  renderNav();
  document.getElementById('filtreBadge').textContent = isFiltered() ? '● Filtres actifs' : '';
}
function go(p,s){
  if (STATE.page!==p || STATE.sub!==s){ STATE.page=p; STATE.sub=s; renderPage(); }
}

/* ============================ SLICER WIRING ============================ */
function initSlicers(){
  const years = [...new Set(MONTH_META.map(m=>m.year))].sort();
  document.getElementById('yearChiclets').innerHTML = years.map(y=>
    `<div class="chic" data-y="${y}" onclick="toggleYear(${y})">${y}</div>`).join('');

  const qm = document.getElementById('qMenu');
  qm.innerHTML = '<div class="dd-item active" onclick="selQ(0)">Tous</div>' +
    [1,2,3,4].map(q=>`<div class="dd-item" data-q="${q}" onclick="selQ(${q})">T${q}</div>`).join('');
  const mm = document.getElementById('mMenu');
  const noms=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  mm.innerHTML = '<div class="dd-item active" onclick="selM(0)">Tous</div>' +
    noms.map((n,i)=>`<div class="dd-item" data-m="${i+1}" onclick="selM(${i+1})">${n}</div>`).join('');

  document.getElementById('dateStart').value = FIN_DATES[FILT.start];
  document.getElementById('dateEnd').value = FIN_DATES[FILT.end];
  syncSlider();
}
const FIN_DATES = MONTH_LABELS.map((l,i)=>{ const y=2024+Math.floor(i/12), m=i%12+1; return `${String(m).padStart(2,'0')}/${String(1).padStart(2,'0')}/${y}`; });

function toggleDD(k){ const menu=document.getElementById(k==='q'?'qMenu':'mMenu'); menu.style.display = menu.style.display==='none'?'block':'none'; }
function selQ(q){
  FILT.quarter=q; FILT.month=0;
  const qm=document.getElementById('qMenu'); [...qm.children].forEach(c=>c.classList.toggle('active', +c.dataset.q===q));
  document.getElementById('qLabel').textContent = q?('T'+q):'Tous';
  const mm=document.getElementById('mMenu'); [...mm.children].forEach(c=>c.classList.toggle('active', +c.dataset.m===0));
  document.getElementById('mLabel').textContent='Tous';
  renderPage();
}
function selM(m){
  FILT.month=m; FILT.quarter=0;
  const mm=document.getElementById('mMenu'); [...mm.children].forEach(c=>c.classList.toggle('active', +c.dataset.m===m));
  const noms=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('mLabel').textContent = m?noms[m-1]:'Tous';
  const qm=document.getElementById('qMenu'); [...qm.children].forEach(c=>c.classList.toggle('active', +c.dataset.q===0));
  document.getElementById('qLabel').textContent='Tous';
  renderPage();
}
function toggleYear(y){
  if (FILT.years.has(y)) FILT.years.delete(y); else FILT.years.add(y);
  [...document.getElementById('yearChiclets').children].forEach(ch=>ch.classList.toggle('active', FILT.years.has(+ch.dataset.y)));
  renderPage();
}
function clearFilters(){
  FILT.years.clear(); FILT.quarter=0; FILT.month=0; FILT.start=0; FILT.end=N_MONTHS-1;
  [...document.getElementById('yearChiclets').children].forEach(ch=>ch.classList.remove('active'));
  [...document.getElementById('qMenu').children].forEach(c=>c.classList.toggle('active', +c.dataset.q===0));
  document.getElementById('qLabel').textContent='Tous';
  [...document.getElementById('mMenu').children].forEach(c=>c.classList.toggle('active', +c.dataset.m===0));
  document.getElementById('mLabel').textContent='Tous';
  document.getElementById('dateStart').value=FIN_DATES[0];
  document.getElementById('dateEnd').value=FIN_DATES[N_MONTHS-1];
  syncSlider();
  renderPage();
}
function syncSlider(){
  const s=document.getElementById('rangeStart'), e=document.getElementById('rangeEnd');
  s.value=FILT.start; e.value=FILT.end;
  const total=100;
  const left=(FILT.start/(N_MONTHS-1))*total, right=(FILT.end/(N_MONTHS-1))*total;
  const fill=document.getElementById('fillBar');
  fill.style.left=left+'%'; fill.style.width=(right-left)+'%';
}
function rangeMove(which){
  const s=document.getElementById('rangeStart'), e=document.getElementById('rangeEnd');
  if (which==='start'){ FILT.start=Math.min(+s.value, FILT.end); }
  else { FILT.end=Math.max(+e.value, FILT.start); }
  document.getElementById('dateStart').value=FIN_DATES[FILT.start];
  document.getElementById('dateEnd').value=FIN_DATES[FILT.end];
  syncSlider();
  renderPage();
}
function parseYMD(str){
  const m=str.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (!m) return null;
  return (m[3]-2024)*12 + (m[1]-1);
}
function dateInput(which){
  const s=document.getElementById('dateStart').value, e=document.getElementById('dateEnd').value;
  const si=parseYMD(s), ei=parseYMD(e);
  if (si===null||ei===null) return;
  FILT.start=Math.min(si,ei); FILT.end=Math.max(si,ei);
  syncSlider();
  renderPage();
}

/* ============================ RESIZE & INIT ============================ */
function fitSlide(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const s=Math.min(vw/1920, vh/1080);
  document.getElementById('slide').style.transform =
    `translate(${(vw-1920*s)/2}px, ${(vh-1080*s)/2}px) scale(${s})`;
}
window.addEventListener('resize', fitSlide);
window.addEventListener('DOMContentLoaded', ()=>{ fitSlide(); initSlicers(); renderPage(); });
</script>
