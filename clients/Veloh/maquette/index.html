<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOH — Pilotage de flotte cyclable</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --primary:#B69E7F;
    --surface:#FFFFFF;
    --canvas:#F1F5F9;
    --card-bg:#FFFFFF;
    --border:#CBD5E1;
    --text-primary:#0F172A;
    --text-secondary:#64748B;
    --consolidation:#FF0000;
  }
  html,body{margin:0;padding:0;height:100%;background:#0b0f14;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;}
  .slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;background:var(--canvas);}
  .banner{position:absolute;top:0;left:0;width:100%;height:97px;background:var(--primary);clip-path:polygon(342px 0,100% 0,100% 97px,267px 97px);}
  .logo-zone{position:absolute;top:0;left:0;width:320px;height:97px;background:var(--surface);clip-path:polygon(0 0,320px 0,244px 97px,0 97px);display:flex;align-items:center;justify-content:center;}
  .logo-zone .logo{padding-right:36px;display:flex;align-items:center;justify-content:center;max-height:70px;}
  .logo-zone img{max-height:70px;max-width:210px;object-fit:contain;}
  .title-band{position:absolute;top:0;left:360px;right:48px;height:97px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--surface);}
  .title-band h1{font-size:24px;font-weight:700;letter-spacing:.5px;margin:0;line-height:1.1;}
  .title-band .sub{font-size:13px;opacity:.9;margin-top:3px;letter-spacing:.2px;}
  .info-btn{position:absolute;top:30px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;font-family:serif;cursor:help;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:60;}
  .popover{position:absolute;top:110px;right:16px;width:420px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:16px;z-index:70;display:none;}
  .info-btn:hover + .popover, .popover:hover{display:block;}
  .popover h3{color:var(--primary);text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:1px;margin:0 0 4px;}
  .popover .pdesc{font-size:11px;color:var(--text-secondary);margin:0 0 10px;}
  .popover .sp{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:11px;color:var(--text-primary);}
  .popover .dot{width:8px;height:8px;border-radius:50%;margin-top:3px;flex-shrink:0;}
  .filter-pane{position:absolute;left:11px;top:116px;width:235px;bottom:44px;background:var(--surface);border-radius:10px;padding:16px;display:flex;flex-direction:column;}
  .pane-title{display:flex;align-items:center;gap:8px;color:var(--primary);font-weight:700;font-size:14px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--border);}
  .pane-title svg{width:16px;height:16px;fill:var(--primary);}
  .slicer-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;}
  .chiclets{display:flex;flex-wrap:wrap;gap:6px;}
  .chiclet{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-secondary);background:var(--canvas);border:1px solid var(--border);cursor:pointer;}
  .chiclet.active{color:var(--surface);background:var(--primary);border-color:var(--primary);}
  .select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-primary);background:var(--surface);}
  .date-row{display:flex;gap:6px;}
  .date-input{flex:1;padding:6px;border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--text-primary);background:var(--surface);}
  .slider{margin-top:8px;}
  .slider-track{position:relative;height:6px;background:var(--border);border-radius:99px;}
  .slider-fill{position:absolute;height:100%;background:var(--primary);border-radius:99px;}
  .slider-handle{position:absolute;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;background:var(--surface);border:2.5px solid var(--primary);border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .clear-btn{margin-top:auto;width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:12px;cursor:pointer;}
  .clear-btn:hover{color:var(--primary);border-color:var(--primary);}
  .main-area{position:absolute;left:262px;top:116px;right:16px;bottom:44px;display:flex;flex-direction:column;}
  .nav-l1{display:flex;gap:12px;}
  .nav-l1 .pill{flex:1;padding:11px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;color:var(--text-secondary);text-align:center;cursor:pointer;user-select:none;}
  .nav-l1 .pill.active{background:var(--primary);color:var(--surface);border-color:var(--primary);}
  .nav-l2{display:flex;gap:24px;margin-top:10px;padding-bottom:0;border-bottom:1px solid var(--border);}
  .nav-l2 .sub{font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;background:transparent;border:0;padding:0 0 9px;user-select:none;}
  .nav-l2 .sub.active{color:var(--primary);font-weight:700;border-bottom:2px solid var(--primary);}
  .content{flex:1;min-height:0;margin-top:12px;display:flex;flex-direction:column;gap:12px;}
  .kpi-row{display:grid;gap:12px;height:132px;flex:none;}
  .kpi-card{position:relative;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;}
  .kpi-card.consol{border:2px dashed var(--consolidation);}
  .kpi-card .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);}
  .kpi-card .label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;}
  .kpi-card .value{font-size:30px;font-weight:800;color:var(--text-primary);letter-spacing:-.5px;margin:6px 0 2px;}
  .kpi-card .sub{font-size:11px;color:var(--text-secondary);}
  .kpi-card .trend{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;margin-top:6px;width:max-content;}
  .trend.good{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;}
  .consol-pill{position:absolute;bottom:6px;right:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--consolidation);background:rgba(255,0,0,.08);padding:2px 6px;border-radius:4px;}
  .viz-grid{flex:1;min-height:0;display:grid;gap:12px;}
  .viz-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;min-height:0;}
  .viz-card .vh{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:8px;flex:none;}
  .viz-card .vt{font-size:14px;font-weight:700;color:var(--text-primary);}
  .viz-card .vu{font-size:11px;color:var(--text-secondary);font-weight:400;margin-left:6px;}
  .chart{flex:1;min-height:0;width:100%;}
  .table-wrap{flex:1;min-height:0;overflow:auto;}
  table{width:100%;border-collapse:collapse;}
  thead th{background:var(--primary);color:var(--surface);font-size:11px;font-weight:600;text-align:left;padding:8px 12px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;}
  tbody td{font-size:12px;color:var(--text-primary);padding:8px 12px;border-bottom:1px solid var(--border);}
  tbody tr:nth-child(odd){background:var(--canvas);}
  td.num,th.num{text-align:right;font-family:ui-monospace,monospace;}
  .footer{position:absolute;left:0;right:0;bottom:0;height:32px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary);background:var(--canvas);border-top:1px solid var(--border);}
</style>
</head>
<body>
<div id="slide" class="slide">

  <div class="banner"></div>
  <div class="logo-zone"><div class="logo"><img src="../logo.png" alt="logo"></div></div>

  <div class="title-band">
    <h1>VELOH — Pilotage de flotte cyclable</h1>
    <div class="sub">Cyclistes · Flotte · Sorties · Composants — Janv. 2024 – Juil. 2025</div>
  </div>

  <div class="info-btn">i</div>
  <div class="popover" id="popover"></div>

  <div class="filter-pane">
    <div class="pane-title">
      <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
      Filtres
    </div>
    <div class="slicer-label">Année fiscale</div>
    <div class="chiclets">
      <span class="chiclet active">FY 2024</span>
      <span class="chiclet">FY 2025</span>
    </div>
    <div class="slicer-label">Trimestre</div>
    <select class="select">
      <option>Tous les trimestres</option><option>T1</option><option>T2</option><option>T3</option><option>T4</option>
    </select>
    <div class="slicer-label">Mois</div>
    <select class="select">
      <option>Tous les mois</option><option>Janvier</option><option>Février</option><option>Mars</option><option>Avril</option><option>Mai</option><option>Juin</option><option>Juillet</option><option>Août</option><option>Septembre</option><option>Octobre</option><option>Novembre</option><option>Décembre</option>
    </select>
    <div class="slicer-label">Période</div>
    <div class="date-row">
      <input class="date-input" type="text" value="01/01/2024">
      <span style="align-self:center;color:var(--text-secondary);font-size:11px">→</span>
      <input class="date-input" type="text" value="31/07/2025">
    </div>
    <div class="slider">
      <div class="slider-track"><div class="slider-fill" style="left:0%;width:100%"></div>
        <div class="slider-handle" style="left:0%"></div>
        <div class="slider-handle" style="left:100%"></div>
      </div>
    </div>
    <button class="clear-btn">Effacer tous les filtres</button>
  </div>

  <div class="main-area" id="mainArea"></div>

  <div class="footer">Données fictives — Maquette haute-fidélité Power BI · VELOH</div>
</div>

<script>
const CSS = getComputedStyle(document.documentElement);
const PRIMARY = CSS.getPropertyValue('--primary').trim();
const SURFACE = CSS.getPropertyValue('--surface').trim();
const TEXT1 = CSS.getPropertyValue('--text-primary').trim();
const TEXT2 = CSS.getPropertyValue('--text-secondary').trim();
const BORDER = CSS.getPropertyValue('--border').trim();

const charts = [];

/* ---------- Données issues de donnees.xlsx ---------- */
const KM_LABELS = ["Janv 24","Févr 24","Mars 24","Avr 24","Mai 24","Juin 24","Juil 24","Août 24","Sept 24","Oct 24","Nov 24","Déc 24","Janv 25","Févr 25","Mars 25","Avr 25","Mai 25","Juin 25","Juil 25"];
const KM = [2225,3832,11129,19791,24686,24642,27417,25161,21115,16203,8698,3946,2235,5006,11521,18638,23816,25865,24323];
const RIDES = [40,66,185,335,410,391,449,417,350,273,145,64,38,75,190,325,404,424,419];
const PAYS = [{name:'Canada',value:36},{name:'France',value:9},{name:'Belgique',value:5}];
const VILLES = [{name:'Saint-Bruno',value:23},{name:'Liège',value:4},{name:'Lyon',value:3},{name:'Repentigny',value:3},{name:'Annecy',value:2},{name:'Gatineau',value:2},{name:'Nantes',value:2},{name:'Bordeaux',value:2}];
const KM_PAYS = [{name:'Canada',value:209098},{name:'France',value:56812},{name:'Belgique',value:34338}];
const VELOS_CYCLISTE = [{name:'1 vélo',value:14},{name:'2 vélos',value:27},{name:'3 vélos',value:9}];
const MARQUES_ATTR = [{name:'Pinarello',value:9},{name:'Giant',value:7},{name:'Canyon',value:7},{name:'Scott',value:7},{name:'Orbea',value:6},{name:'Colnago',value:5},{name:'Trek',value:5},{name:'Factor',value:5}];
const ANNEES_FLOTTE = [{name:'2021',value:1},{name:'2022',value:20},{name:'2023',value:34},{name:'2024',value:25}];
const KM_MARQUE = [{name:'Factor',value:41575},{name:'Giant',value:39448},{name:'Merida',value:34407},{name:'Specialized',value:26017},{name:'Canyon',value:20099},{name:'Trek',value:15717}];
const MARQUES_TOP = [{name:'Trek',value:6},{name:'Giant',value:6},{name:'Specialized',value:5},{name:'Cervelo',value:5},{name:'Canyon',value:5},{name:'Pinarello',value:4},{name:'BMC',value:4},{name:'Scott',value:4}];
const MARQUES_TOP5 = [{name:'Trek',value:6},{name:'Giant',value:6},{name:'Specialized',value:5},{name:'Cervelo',value:5},{name:'Canyon',value:5}];

/* ---------- Navigation ---------- */
const NAV = {
  "Cyclistes": {
    desc:"Pilotage des cyclistes de la flotte : activité, répartition géographique et affectations de vélos.",
    subs:["Vue d'ensemble","Répartition géographique","Affectations vélos"]
  },
  "Flotte vélos": {
    desc:"Suivi du parc de vélos : composition de la flotte, marques et années de sortie.",
    subs:["Vue d'ensemble","Répartition par marque"]
  }
};

/* ---------- Layouts par sous-page ---------- */
const TABLE_AFFECT = `<div class="table-wrap"><table><thead><tr><th>Cycliste</th><th class="num">Vélos</th><th>Marques attribuées</th></tr></thead><tbody>
<tr><td>Pierre Bouchard</td><td class="num">2</td><td>Giant · Scott</td></tr>
<tr><td>Alexandre Moreau</td><td class="num">3</td><td>Canyon · Pinarello · Trek</td></tr>
<tr><td>Patrick Dumont</td><td class="num">2</td><td>Factor · Orbea</td></tr>
<tr><td>Caroline Beaudoin</td><td class="num">2</td><td>Merida · Colnago</td></tr>
<tr><td>Jean-Philippe Paquet</td><td class="num">1</td><td>Specialized</td></tr>
<tr><td>Manon Fortin</td><td class="num">2</td><td>Canyon · Trek</td></tr></tbody></table></div>`;

const TABLE_MARQUES = `<div class="table-wrap"><table><thead><tr><th>Marque</th><th class="num">Vélos</th><th class="num">% flotte</th><th class="num">Km parcourus</th></tr></thead><tbody>
<tr><td>Trek</td><td class="num">6</td><td class="num">7,5 %</td><td class="num">15 717</td></tr>
<tr><td>Giant</td><td class="num">6</td><td class="num">7,5 %</td><td class="num">39 448</td></tr>
<tr><td>Specialized</td><td class="num">5</td><td class="num">6,3 %</td><td class="num">26 017</td></tr>
<tr><td>Cervelo</td><td class="num">5</td><td class="num">6,3 %</td><td class="num">9 812</td></tr>
<tr><td>Canyon</td><td class="num">5</td><td class="num">6,3 %</td><td class="num">20 099</td></tr>
<tr><td>Pinarello</td><td class="num">4</td><td class="num">5,0 %</td><td class="num">15 463</td></tr></tbody></table></div>`;

const PAGE_DATA = {
  "1.1":{
    kpis:[
      {label:"Cyclistes actifs", value:"40", sub:"sur 50 enregistrés", consol:true},
      {label:"Kilomètres totaux", value:"300,2 k", sub:"Janv. 2024 – Juil. 2025", trend:"+12,4 % vs PY"},
      {label:"Sorties", value:"5 000", sub:"sur 19 mois", trend:"+8,1 % vs PY"},
      {label:"Km / cycliste", value:"7 506", sub:"moyenne cyclistes actifs"},
      {label:"Durée moy. / sortie", value:"131 min", sub:"≈ 2 h 11"}
    ],
    row2Cols:"2fr 1fr",
    row2:[
      {title:"Évolution kilométrique mensuelle", unit:"km / mois", id:"c11", spec:{type:'line',labels:KM_LABELS,data:KM,area:true}},
      {title:"Cyclistes par pays", unit:"50 cyclistes", id:"c12", spec:{type:'donut',items:PAYS,center:'50',centerSub:'cyclistes'}}
    ],
    row3:{type:'chart', title:"Sorties par mois", id:"c13", spec:{type:'bar',labels:KM_LABELS,data:RIDES}}
  },
  "1.2":{
    kpis:[
      {label:"Pays couverts", value:"3", sub:"Canada · France · Belgique", consol:true},
      {label:"Villes couvertes", value:"16", sub:"zones de pratique"},
      {label:"Cyclistes par pays", value:"36", sub:"Canada (majoritaire)"}
    ],
    row2Cols:"1fr 2fr",
    row2:[
      {title:"Cyclistes par pays", unit:"effectifs", id:"c21", spec:{type:'bar',labels:['Canada','France','Belgique'],data:[36,9,5]}},
      {title:"Top villes de pratique", unit:"cyclistes", id:"c22", spec:{type:'hbar',items:VILLES}}
    ],
    row3:{type:'chart', title:"Kilomètres parcourus par pays", id:"c23", spec:{type:'hbar',items:KM_PAYS}}
  },
  "1.3":{
    kpis:[
      {label:"Cyclistes avec vélo", value:"50", sub:"1+ vélo attribué", consol:true},
      {label:"Vélos attribués", value:"57", sub:"sur 80 en flotte"},
      {label:"Ratio vélos / cycliste", value:"1,14", sub:"57 vélos · 50 cyclistes"}
    ],
    row2Cols:"1fr 2fr",
    row2:[
      {title:"Vélos par cycliste", unit:"répartition", id:"c31", spec:{type:'donut',items:VELOS_CYCLISTE,center:'50',centerSub:'cyclistes'}},
      {title:"Marques attribuées", unit:"vélos", id:"c32", spec:{type:'hbar',items:MARQUES_ATTR}}
    ],
    row3:{type:'table', title:"Détail des affectations", html:TABLE_AFFECT}
  },
  "2.1":{
    kpis:[
      {label:"Vélos en flotte", value:"80", sub:"parc actif"},
      {label:"Marques distinctes", value:"25", sub:"fournisseurs"},
      {label:"Année moyenne du parc", value:"2023", sub:"2021 – 2024"},
      {label:"Km total parcouru", value:"300,2 k", sub:"cumul sorties"}
    ],
    row2Cols:"2fr 1fr",
    row2:[
      {title:"Kilomètres par mois (flotte)", unit:"km / mois", id:"c41", spec:{type:'line',labels:KM_LABELS,data:KM,area:true}},
      {title:"Flotte par année de sortie", unit:"vélos", id:"c42", spec:{type:'donut',items:ANNEES_FLOTTE,center:'80',centerSub:'vélos'}}
    ],
    row3:{type:'chart', title:"Top marques par km parcouru", id:"c43", spec:{type:'hbar',items:KM_MARQUE}}
  },
  "2.2":{
    kpis:[
      {label:"Vélos par marque", value:"6", sub:"Trek · Giant (max)"},
      {label:"Marque dominante", value:"Trek", sub:"6 vélos · ex æquo Giant"},
      {label:"Part des 3 leaders", value:"21 %", sub:"17 des 80 vélos"}
    ],
    row2Cols:"2fr 1fr",
    row2:[
      {title:"Vélos par marque", unit:"effectifs", id:"c51", spec:{type:'hbar',items:MARQUES_TOP}},
      {title:"Part de la flotte", unit:"top 5", id:"c52", spec:{type:'donut',items:MARQUES_TOP5,center:'80',centerSub:'vélos'}}
    ],
    row3:{type:'table', title:"Détail par marque", html:TABLE_MARQUES}
  }
};

/* ---------- ECharts builders ---------- */
const baseTooltip = {trigger:'axis',backgroundColor:'#ffffff',borderColor:BORDER,borderWidth:1,padding:[8,12],textStyle:{color:'#0f172a',fontSize:12},extraCssText:'box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);border-radius:6px;'};

function optionFor(spec){
  if(spec.type==='line') return {
    backgroundColor:'transparent', tooltip:baseTooltip,
    grid:{top:30,right:16,bottom:26,left:44,containLabel:true},
    xAxis:{type:'category',data:spec.labels,axisLine:{lineStyle:{color:'#94a3b8'}},axisTick:{show:false},axisLabel:{color:TEXT2,fontSize:10}},
    yAxis:{type:'value',axisLabel:{color:TEXT2,fontSize:10},splitLine:{lineStyle:{color:'#e2e8f0',type:'dashed'}}},
    series:[{type:'line',data:spec.data,smooth:0.2,symbol:'circle',symbolSize:5,lineStyle:{width:2.5,color:PRIMARY},itemStyle:{color:PRIMARY,borderWidth:2,borderColor:'#fff'},areaStyle:spec.area?{opacity:0.12,color:PRIMARY}:undefined}]
  };
  if(spec.type==='bar') return {
    backgroundColor:'transparent', tooltip:baseTooltip,
    grid:{top:16,right:14,bottom:26,left:40,containLabel:true},
    xAxis:{type:'category',data:spec.labels,axisLabel:{color:TEXT2,fontSize:10},axisLine:{lineStyle:{color:'#94a3b8'}},axisTick:{show:false}},
    yAxis:{type:'value',axisLabel:{color:TEXT2,fontSize:10},splitLine:{lineStyle:{color:'#e2e8f0',type:'dashed'}}},
    series:[{type:'bar',data:spec.data,barMaxWidth:24,itemStyle:{borderRadius:[3,3,0,0],color:PRIMARY}}]
  };
  if(spec.type==='donut') return {
    backgroundColor:'transparent', tooltip:{...baseTooltip,trigger:'item'},
    legend:{orient:'vertical',right:8,top:'center',itemGap:10,textStyle:{color:TEXT2,fontSize:11}},
    title:{text:spec.center||'',subtext:spec.centerSub||'',left:'26%',top:'36%',textAlign:'center',textStyle:{color:TEXT1,fontSize:22,fontWeight:700},subtextStyle:{color:TEXT2,fontSize:11}},
    series:[{type:'pie',radius:['52%','72%'],center:['30%','50%'],label:{show:true,formatter:'{d}%',distanceToLabelLine:5,fontSize:10,color:TEXT2},itemStyle:{borderRadius:4,borderColor:SURFACE,borderWidth:2},data:spec.items}]
  };
  if(spec.type==='hbar') return {
    backgroundColor:'transparent', tooltip:{...baseTooltip,axisPointer:{type:'shadow'}},
    grid:{top:10,right:70,bottom:20,left:10,containLabel:true},
    xAxis:{type:'value',axisLabel:{color:TEXT2,fontSize:10},splitLine:{lineStyle:{color:'#e2e8f0',type:'dashed'}}},
    yAxis:{type:'category',data:spec.items.map(i=>i.name),axisLabel:{color:TEXT2,fontSize:11},axisLine:{lineStyle:{color:'#94a3b8'}},axisTick:{show:false}},
    series:[{type:'bar',data:spec.items.map(i=>i.value),barWidth:16,itemStyle:{borderRadius:[0,4,4,0],color:PRIMARY},label:{show:true,position:'right',fontSize:11,fontWeight:'bold',color:TEXT1,distance:8,formatter:v=>v.value.toLocaleString('fr-FR')}}]
  };
}

function initChart(id, spec){
  const el = document.getElementById(id);
  if(!el) return;
  const c = echarts.init(el);
  c.setOption(optionFor(spec));
  charts.push(c);
}
function disposeCharts(){ while(charts.length){ charts.pop().dispose(); } }

/* ---------- Rendu ---------- */
function kpiCard(k){
  return `<div class="kpi-card ${k.consol?'consol':''}">
    <div class="accent"></div>
    <div class="label">${k.label}</div>
    <div class="value">${k.value}</div>
    <div class="sub">${k.sub}</div>
    ${k.trend?`<span class="trend good">${k.trend}</span>`:''}
    ${k.consol?'<span class="consol-pill">En consolidation</span>':''}
  </div>`;
}
function vizCard(title, unit, id){
  return `<div class="viz-card"><div class="vh"><div class="vt">${title}<span class="vu">${unit||''}</span></div></div><div id="${id}" class="chart"></div></div>`;
}

let state = {page:0, subpage:0};

function renderPage(){
  const key = (state.page+1) + '.' + (state.subpage+1);
  const layout = PAGE_DATA[key];
  const main = document.getElementById('mainArea');

  main.innerHTML = `
    <div class="nav-l1" id="nav1"></div>
    <div class="nav-l2" id="nav2"></div>
    <div class="content">
      <div class="kpi-row" style="grid-template-columns:repeat(${layout.kpis.length},1fr)">${layout.kpis.map(kpiCard).join('')}</div>
      <div class="viz-grid" style="grid-template-columns:${layout.row2Cols}">${layout.row2.map(c=>vizCard(c.title,c.unit,c.id)).join('')}</div>
      <div class="viz-card" style="flex:none;height:190px" id="row3card"></div>
    </div>`;

  // Navigation L1
  const nav1 = document.getElementById('nav1');
  Object.keys(NAV).forEach((name,i)=>{
    const el = document.createElement('div');
    el.className = 'pill' + (i===state.page?' active':'');
    el.textContent = name;
    el.addEventListener('click', ()=>{ state = {page:i, subpage:0}; renderPage(); });
    nav1.appendChild(el);
  });

  // Navigation L2
  const subs = NAV[Object.keys(NAV)[state.page]].subs;
  const nav2 = document.getElementById('nav2');
  subs.forEach((name,i)=>{
    const el = document.createElement('button');
    el.className = 'sub' + (i===state.subpage?' active':'');
    el.textContent = name;
    el.addEventListener('click', ()=>{ state = {page:state.page, subpage:i}; renderPage(); });
    nav2.appendChild(el);
  });

  // Row 3
  const r3 = document.getElementById('row3card');
  if(layout.row3.type==='table'){
    r3.innerHTML = `<div class="vh"><div class="vt">${layout.row3.title}</div></div>${layout.row3.html}`;
  } else {
    r3.innerHTML = vizCard(layout.row3.title, '', layout.row3.id).replace('class="viz-card"','style="flex:1;min-height:0;display:flex;flex-direction:column"');
  }

  // Popover info
  const pageName = Object.keys(NAV)[state.page];
  let html = `<h3>${pageName}</h3><p class="pdesc">${NAV[pageName].desc}</p>`;
  subs.forEach((name,i)=>{
    html += `<div class="sp"><span class="dot" style="background:${i===state.subpage?'#2563EB':'var(--primary)'}"></span><span><b>${name}</b></span></div>`;
  });
  document.getElementById('popover').innerHTML = html;

  // Charts (après insertion DOM)
  disposeCharts();
  requestAnimationFrame(()=>{
    layout.row2.forEach(c=>initChart(c.id, c.spec));
    if(layout.row3.type==='chart') initChart(layout.row3.id, layout.row3.spec);
  });
}

/* ---------- Scaling 1920×1080 ---------- */
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw/1920, vh/1080);
  document.getElementById('slide').style.transform =
    `translate(${(vw-1920*s)/2}px, ${(vh-1080*s)/2}px) scale(${s})`;
}
window.addEventListener('resize', ()=>{ resize(); charts.forEach(c=>c.resize()); });

resize();
renderPage();
</script>
</body>
</html>
