<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>agiledss — Maquette Power BI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --primary:#B69E7F; --surface:#FFFFFF; --canvas:#F1F5F9; --border:#CBD5E1;
    --card-bg:#FFFFFF; --text-primary:#0F172A; --text-secondary:#64748B;
  }
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--canvas);}
  #viewport{position:fixed;inset:0;overflow:hidden;}
  .slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;background:var(--canvas);}
  .banner{position:absolute;top:0;left:0;right:0;height:97px;background:var(--primary);clip-path:polygon(342px 0,100% 0,100% 97px,267px 97px);}
  .logo-zone{position:absolute;top:0;left:0;width:320px;height:97px;background:var(--surface);clip-path:polygon(0 0,320px 0,244px 97px,0 97px);display:flex;align-items:center;justify-content:center;padding-right:36px;z-index:2;}
  .logo-zone img{max-height:70px;max-width:200px;object-fit:contain;}
  .header-text{position:absolute;top:0;left:360px;right:52px;height:97px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--surface);z-index:2;pointer-events:none;}
  .header-text h1{font-size:26px;font-weight:700;letter-spacing:.02em;margin:0;line-height:1.15;}
  .header-text p{font-size:13px;opacity:.92;margin:2px 0 0;}
  .info-wrap{position:absolute;top:30px;right:16px;z-index:70;}
  .info-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;font-family:Georgia,'Times New Roman',serif;cursor:help;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .info-wrap .popover{position:absolute;top:42px;right:0;width:400px;display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.15);padding:14px 16px;box-sizing:border-box;text-align:left;}
  .info-wrap:hover .popover{display:block;}
  .pop-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--primary);}
  .pop-sub{font-size:11px;color:var(--text-secondary);margin-top:2px;}
  .pop-divider{height:1px;background:var(--border);margin:8px 0;}
  .pop-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--text-primary);}
  .pop-item.active{font-weight:700;}
  .pop-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .pop-item .dot.blue{background:#2563EB;}
  .pop-item .dot.pri{background:var(--primary);}
  .pop-now{font-size:10px;color:var(--text-secondary);font-weight:600;}
  .filter-pane{position:absolute;left:11px;top:116px;bottom:40px;width:235px;background:var(--surface);border-radius:10px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);z-index:5;}
  .pane-head{display:flex;align-items:center;gap:8px;color:var(--primary);font-weight:600;font-size:13px;padding-bottom:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .badge{display:none;font-size:10px;font-weight:600;color:var(--primary);margin-left:auto;}
  .badge.show{display:inline-flex;align-items:center;gap:4px;}
  .slicer-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);flex-shrink:0;}
  .chiclets{display:flex;gap:8px;flex-shrink:0;}
  .chiclet{flex:1;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:500;background:var(--canvas);color:var(--text-secondary);border:1px solid var(--border);text-align:center;cursor:pointer;transition:all .15s;box-sizing:border-box;}
  .chiclet.active{background:var(--primary);color:var(--surface);border-color:var(--primary);font-weight:600;}
  select{width:100%;height:32px;padding:0 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-primary);outline:none;box-sizing:border-box;flex-shrink:0;}
  .date-inputs{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .date-inputs input{flex:1;min-width:0;height:32px;padding:0 6px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text-primary);background:var(--surface);text-align:center;outline:none;box-sizing:border-box;}
  .date-inputs span{color:var(--text-secondary);font-size:12px;}
  .range-wrap{position:relative;height:20px;flex-shrink:0;}
  .range-track{position:absolute;top:50%;left:0;right:0;height:6px;transform:translateY(-50%);background:var(--border);border-radius:9999px;}
  .range-fill{position:absolute;top:50%;height:6px;transform:translateY(-50%);background:var(--primary);border-radius:9999px;}
  .range-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;-webkit-appearance:none;appearance:none;pointer-events:none;}
  .range-input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);cursor:pointer;pointer-events:auto;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .range-input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--primary);cursor:pointer;pointer-events:auto;}
  #rangeStart{z-index:3;}
  #rangeEnd{z-index:2;}
  .clear-btn{margin-top:auto;width:100%;height:32px;padding:0 10px;font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex-shrink:0;box-sizing:border-box;}
  .content{position:absolute;left:262px;top:97px;right:0;bottom:40px;padding:8px 20px 0 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;}
  .nav-l1{display:flex;gap:12px;flex-shrink:0;}
  .nav-pill{flex:1;padding:10px 16px;border-radius:8px;font-size:12px;text-align:center;cursor:pointer;transition:all .15s;box-sizing:border-box;}
  .nav-pill.inactive{background:var(--surface);color:var(--text-secondary);border:1px solid var(--border);font-weight:500;}
  .nav-pill.inactive:hover{border-color:var(--primary);color:var(--text-primary);}
  .nav-pill.active{background:var(--primary);color:var(--surface);border:1px solid var(--primary);font-weight:600;cursor:default;}
  .nav-l2{display:flex;gap:28px;align-items:center;padding:0 2px;height:36px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .l2-link{font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;background:transparent;border:0;padding:0;height:36px;display:flex;align-items:center;box-sizing:border-box;font-family:inherit;}
  .l2-link:hover{color:var(--text-primary);}
  .l2-link.active{color:var(--primary);font-weight:600;border-bottom:2px solid var(--primary);}
  .kpi-row{display:flex;gap:12px;flex-shrink:0;height:130px;}
  .kpi-card{flex:1;min-width:0;height:130px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px 10px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);box-sizing:border-box;}
  .kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);}
  .kpi-card.consol{border:2px dashed #FF0000;}
  .kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:120px;}
  .kpi-value{font-size:28px;font-weight:700;color:var(--text-primary);margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-sub{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-foot{margin-top:auto;min-height:22px;display:flex;align-items:center;gap:6px;padding-top:4px;}
  .consol-flag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#FF0000;background:rgba(255,0,0,.08);padding:2px 6px;border-radius:4px;white-space:nowrap;}
  .trend{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:9999px;font-size:11px;font-weight:600;}
  .trend.up{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0;}
  .trend.down{background:#ffe4e6;color:#9f1239;border:1px solid #fecdd3;}
  .visuals{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;}
  .visual-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .vc-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:8px;flex-shrink:0;}
  .vc-title{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vc-sub{font-size:11px;color:var(--text-secondary);white-space:nowrap;}
  .chart-holder{position:relative;flex:1;min-height:0;}
  .chart{position:absolute;inset:0;}
  .donut-center{position:absolute;left:30%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;line-height:1;text-align:center;}
  .donut-center .dc-value{font-size:22px;font-weight:700;color:var(--text-primary);}
  .donut-center .dc-sub{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  .table-wrap{flex:1;min-height:0;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead th{background:var(--primary);color:var(--surface);font-weight:600;text-align:left;padding:6px 10px;text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;position:sticky;top:0;}
  thead th:last-child{text-align:right;}
  tbody td{padding:5px 10px;border-bottom:1px solid var(--border);color:var(--text-primary);font-size:11.5px;}
  tbody tr:nth-child(even){background:var(--canvas);}
  tbody tr:hover{background:var(--border);}
  td.num{font-family:ui-monospace,SFMono-Regular,monospace;text-align:right;font-variant-numeric:tabular-nums;}
  .footer{position:absolute;bottom:0;left:0;right:0;height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary);border-top:1px solid var(--border);background:var(--canvas);}
</style>
</head>

function hexToHsl(hex){
  var h = hex.replace('#','');
  var r=parseInt(h.substr(0,2),16)/255, g=parseInt(h.substr(2,2),16)/255, b=parseInt(h.substr(4,2),16)/255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), hh, s, l=(mx+mn)/2;
  if (mx===mn){ hh=0; s=0; }
  else {
    var d=mx-mn; s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    switch(mx){
      case r: hh=(g-b)/d+(g<b?6:0); break;
      case g: hh=(b-r)/d+2; break;
      default: hh=(r-g)/d+4;
    }
    hh*=60;
  }
  return [hh, s*100, l*100];
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  var k=function(n){ return (n + h/30) % 12; };
  var a=s*Math.min(l,1-l);
  var f=function(n){ return l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1))); };
  var tx=function(x){ var v=Math.round(x*255).toString(16); return v.length<2?'0'+v:v; };
  return '#'+tx(f(0))+tx(f(8))+tx(f(4));
}
function derivePalette(primary){
  var c = hexToHsl(primary);
  var h=c[0], s=c[1], l=c[2];
  return [
    primary,
    hslToHex(h, s, Math.max(15, l-18)),
    hslToHex(h, Math.max(10,s-12), Math.min(92,l+15)),
    hslToHex((h+28)%360, Math.max(18,s-8), Math.min(62,l)),
    hslToHex((h+180)%360, Math.max(14,s-22), Math.min(55,l)),
    hslToHex(h, Math.max(8,s-28), l)
  ];
}

function yearMask(year, onlyMonths){
  var mask = 0;
  for (var i=0;i<N_MONTHS;i++){
    var m = MONTH_META[i];
    if (m.year!==year) continue;
    if (onlyMonths && !onlyMonths[m.month]) continue;
    mask |= (1<<i);
  }
  return mask;
}
function countActifs(mask){
  var n = 0;
  for (var k in USER_MASKS){ if (USER_MASKS[k] & mask) n++; }
  return n;
}
function aggregates(){
  var agg = { km:0, rides:0, min:0, actifs:0,
    cKm:0,pKm:0,cRides:0,pRides:0,cMin:0,pMin:0,cActifs:0,pActifs:0,
    yoyKm:null, yoyRides:null, yoyMinPerRide:null, yoyKmPerActif:null, yoyActifs:null };
  for (var i=0;i<N_MONTHS;i++){
    var m = MONTH_META[i];
    if (m.year===CUR_YEAR){ agg.km+=KM[i]; agg.rides+=RIDES[i]; agg.min+=MINUTES[i];
                            agg.cKm+=KM[i]; agg.cRides+=RIDES[i]; agg.cMin+=MINUTES[i]; }
    else if (m.year===PREV_YEAR && CUR_MONTHS[m.month]){ agg.pKm+=KM[i]; agg.pRides+=RIDES[i]; agg.pMin+=MINUTES[i]; }
  }
  agg.actifs = countActifs(yearMask(CUR_YEAR));
  agg.cActifs = agg.actifs;
  agg.pActifs = countActifs(yearMask(PREV_YEAR, CUR_MONTHS));
  var _pct = function(c,p){ return (p && p>0) ? (c-p)/p*100 : null; };
  agg.yoyKm = _pct(agg.cKm, agg.pKm);
  agg.yoyRides = _pct(agg.cRides, agg.pRides);
  if (agg.cRides>0 && agg.pRides>0) agg.yoyMinPerRide = _pct(agg.cMin/agg.cRides, agg.pMin/agg.pRides);
  if (agg.cActifs>0 && agg.pActifs>0) agg.yoyKmPerActif = _pct(agg.cKm/agg.cActifs, agg.pKm/agg.pActifs);
  if (agg.cActifs>0 && agg.pActifs>0) agg.yoyActifs = _pct(agg.cActifs, agg.pActifs);
  return agg;
}

function trendHtml(v){
  if (v===null || v===undefined || !isFinite(v)) return '';
  var up = v>=0;
  var s = (up?'+':'−') + Math.abs(v).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' % vs N-1';
  return '<span class="trend ' + (up?'up':'down') + '">' + s + '</span>';
}

  var h = '<table><thead><tr>';
  headers.forEach(function(x,i){ h += '<th' + (numIdx.indexOf(i)>=0?' class="num"':'') + '>' + x + '</th>'; });
  h += '</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr>';
    r.forEach(function(v,i){ h += '<td' + (numIdx.indexOf(i)>=0?' class="num"':'') + '>' + v + '</td>'; });
    h += '</tr>';
  });
  return h + '</tbody></table>';
}
function cardShell(title, sub, inner){
  return '<div class="visual-card"><div class="vc-head"><span class="vc-title">' + title +
    '</span><span class="vc-sub">' + sub + '</span></div>' + inner + '</div>';
}
function donutWithTitle(id, title, sub, slices, centerVal, centerSub){
  return cardShell(title, sub,
    '<div class="chart-holder"><div class="chart" id="' + id + '"></div>' +
    '<div class="donut-center"><div class="dc-value">' + centerVal + '</div><div class="dc-sub">' + centerSub +
    '</div></div></div>');
}

var NAV = [
  { name:'Cyclistes', desc:'Cyclistes actifs, kilométrages, répartition géographique et affectations vélos.', subs:[
    { name:'Vue d\'ensemble', desc:'Activité globale des cyclistes : actifs, kilomètres, sorties, ratios.' },
    { name:'Répartition géographique', desc:'Présence par pays et par ville.' },
    { name:'Affectations vélos', desc:'Vélos attribués aux cyclistes et répartition par marque.' }
  ]},
  { name:'Flotte vélos', desc:'Parc de vélos, marques et état des composants.', subs:[
    { name:'Vue d\'ensemble', desc:'Flotte, marques, ancienneté et kilométrage total.' },
    { name:'Répartition par marque', desc:'Vélos et kilométrages détaillés par marque.' }
  ]}
];
var state = { page:0, sub:0 };

var VIEWS = {
  '1.1': function(agg){
    var kmCyc = agg.actifs>0 ? fmtInt(agg.km/agg.actifs) : '—';
    var dur = agg.rides>0 ? fmtInt(agg.min/agg.rides) + ' min' : '—';
    document.getElementById('kpis').innerHTML =
      kpiCard('Cyclistes actifs', fmtInt(agg.actifs), 'cyclistes sur l\'année ' + CUR_YEAR, trendHtml(agg.yoyActifs), true) +
      kpiCard('Kilomètres totaux', fmtInt(agg.km), 'km parcourus en ' + CUR_YEAR, trendHtml(agg.yoyKm), false) +
      kpiCard('Sorties', fmtInt(agg.rides), 'sorties en ' + CUR_YEAR, trendHtml(agg.yoyRides), false) +
      kpiCard('Km / cycliste', kmCyc, 'km par cycliste actif', trendHtml(agg.yoyKmPerActif), false) +
      kpiCard('Durée moy. / sortie', dur, 'minutes par sortie', trendHtml(agg.yoyMinPerRide), false);
    var paysRaw = sumDimYear(KM_PAYS_M, CUR_YEAR);

    var chartsList = [
      ['v11a', evoLineOption(yearSeries(KM, CUR_YEAR), yearSeries(KM, PREV_YEAR), 'km')],
      ['v11b', evoLineOption(yearSeries(RIDES, CUR_YEAR), yearSeries(RIDES, PREV_YEAR), 'sorties')],
      ['v11c', evoLineOption(yearRatio(MINUTES, RIDES, CUR_YEAR), yearRatio(MINUTES, RIDES, PREV_YEAR), 'min')],
      ['v11d', donutOption(pays)]
    ];
    document.getElementById('visuals').innerHTML =
      cardShell('Km par mois', String(CUR_YEAR) + ' vs ' + String(PREV_YEAR), '<div class="chart-holder"><div class="chart" id="v11a"></div></div>') +
      cardShell('Sorties par mois', String(CUR_YEAR) + ' vs ' + String(PREV_YEAR), '<div class="chart-holder"><div class="chart" id="v11b"></div></div>') +
      cardShell('Durée moyenne / sortie', String(CUR_YEAR) + ' vs ' + String(PREV_YEAR), '<div class="chart-holder"><div class="chart" id="v11c"></div></div>') +
      donutWithTitle('v11d', 'Répartition des km par pays', 'année ' + CUR_YEAR, pays, fmtInt(paysSum), 'km');
    renderCharts(chartsList);
  },
  '1.2': function(agg){
    var totalCyc = Object.keys(PAYS_CYCLISTES).reduce(function(a,k){return a+PAYS_CYCLISTES[k];},0);
    var cycParPays = agg.actifs>0 ? fmtInt(agg.actifs/NB_PAYS) : '—';
    document.getElementById('kpis').innerHTML =
      kpiCard('Pays couverts', String(NB_PAYS), 'pays de présence', '', true) +
      kpiCard('Villes couvertes', String(NB_VILLES), 'villes couvertes', '', false) +
      kpiCard('Cyclistes par pays', cycParPays, 'actifs moyens par pays', trendHtml(agg.yoyActifs), false);
    var topVilles = topBars(VILLE_CYCLISTES, 10);
    var paysSlices = Object.keys(PAYS_CYCLISTES).map(function(k){ return { name:k, value:PAYS_CYCLISTES[k] }; });
    var paysLines = Object.keys(KM_PAYS_M).map(function(k){ return { name:k, data:yearSeries(KM_PAYS_M[k], CUR_YEAR) }; });
    var villeRows = topBars(VILLE_CYCLISTES, 10).map(function(v){

    ];
    document.getElementById('visuals').innerHTML =
      donutWithTitle('v12a', 'Cyclistes par pays', 'répartition de la flotte', paysSlices, fmtInt(totalCyc), 'cyclistes') +
      cardShell('Top 10 villes', 'cyclistes par ville', '<div class="chart-holder"><div class="chart" id="v12b"></div></div>') +
      cardShell('Km par mois par pays', 'année ' + CUR_YEAR, '<div class="chart-holder"><div class="chart" id="v12c"></div></div>') +
      cardShell('Cyclistes par ville', 'détail', '<div class="table-wrap">' +
        tableHtml(['Ville','Cyclistes','Part'], villeRows, [1,2]) + '</div>');
    renderCharts(chartsList);
  },
  '1.3': function(){
    var ratio = (VELOS_ATTRIBUES/USERS_AVEC_VELO).toLocaleString('fr-FR',{maximumFractionDigits:1});
    document.getElementById('kpis').innerHTML =
      kpiCard('Cyclistes avec vélo', String(USERS_AVEC_VELO), 'cyclistes équipés', '', true) +
      kpiCard('Vélos attribués', String(VELOS_ATTRIBUES), 'vélos sur la flotte', '', false) +
      kpiCard('Ratio vélos / cycliste', ratio, 'vélos par cycliste', '', false);
    var kmMarqueRaw = sumDimYear(KM_MARQUE_M, CUR_YEAR);
    var kmMarque = topBars(kmMarqueRaw, 10);
    var topKeys = topBrandKeys(5);
    var marqueLines = topKeys.map(function(k){ return { name:k, data:yearSeries(KM_MARQUE_M[k], CUR_YEAR) }; });
    var rows = Object.keys(MARQUE_VELOS).map(function(k){ return { name:k, velos:MARQUE_VELOS[k] }; })
      .sort(function(a,b){return b.velos-a.velos;}).slice(0,8)
      .map(function(o){ return [o.name, String(o.velos), fmtInt(sumMarqueYear(o.name, CUR_YEAR)), (o.velos/NB_VELOS*100).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' %']; });
    var chartsList = [
      ['v13a', hbarOption(topBars(MARQUE_VELOS, 10))],
      ['v13b', hbarOption(kmMarque)],
      ['v13c', multiLineOption(marqueLines)]
    ];
    document.getElementById('visuals').innerHTML =
      cardShell('Vélos par marque', 'flotte attribuée', '<div class="chart-holder"><div class="chart" id="v13a"></div></div>') +
      cardShell('Km par marque', 'année ' + CUR_YEAR, '<div class="chart-holder"><div class="chart" id="v13b"></div></div>') +
      cardShell('Km par mois — top 5 marques', 'année ' + CUR_YEAR, '<div class="chart-holder"><div class="chart" id="v13c"></div></div>') +
      cardShell('Affectations par marque', 'top 8', '<div class="table-wrap">' +
        tableHtml(['Marque','Vélos','Km ' + CUR_YEAR,'Part'], rows, [1,2,3]) + '</div>');
    renderCharts(chartsList);
  },
  '2.1': function(agg){
    document.getElementById('kpis').innerHTML =
      kpiCard('Vélos en flotte', String(NB_VELOS), 'vélos au parc', '', false) +
      kpiCard('Marques distinctes', String(NB_MARQUES), 'marques référencées', '', false) +
      kpiCard('Année moyenne du parc', String(Math.round(ANNEE_MOY)), 'année moyenne', '', false) +
      kpiCard('Km total parcouru', fmtInt(agg.km), 'km en ' + CUR_YEAR, trendHtml(agg.yoyKm), false);
    var statut = Object.keys(USURE_STATUT).map(function(k){ return { name:k, value:USURE_STATUT[k] }; });
    var totalComposants = statut.reduce(function(a,s){return a+s.value;},0);
    var topKeys = topBrandKeys(5);
    var marqueLines = topKeys.map(function(k){ return { name:k, data:yearSeries(KM_MARQUE_M[k], CUR_YEAR) }; });
    var chartsList = [
      ['v21a', evoLineOption(yearSeries(KM, CUR_YEAR), yearSeries(KM, PREV_YEAR), 'km')],
      ['v21b', donutOption(statut)],
      ['v21c', hbarOption(topBars(MARQUE_VELOS, 10))],
      ['v21d', multiLineOption(marqueLines)]
    ];
    document.getElementById('visuals').innerHTML =
      cardShell('Km par mois', String(CUR_YEAR) + ' vs ' + String(PREV_YEAR), '<div class="chart-holder"><div class="chart" id="v21a"></div></div>') +
      donutWithTitle('v21b', 'Usure des composants', 'statut de contrôle', statut, fmtInt(totalComposants), 'composants') +
      cardShell('Top 10 marques (flotte)', 'vélos au parc', '<div class="chart-holder"><div class="chart" id="v21c"></div></div>') +
      cardShell('Km par mois — top 5 marques', 'année ' + CUR_YEAR, '<div class="chart-holder"><div class="chart" id="v21d"></div></div>');
    renderCharts(chartsList);
  },
  '2.2': function(){
    var top = Object.keys(MARQUE_VELOS).map(function(k){ return { k:k, v:MARQUE_VELOS[k] }; }).sort(function(a,b){return b.v-a.v;});
    var dominante = top.filter(function(o){return o.v===top[0].v;}).map(function(o){return o.k;}).join(' · ');
    document.getElementById('kpis').innerHTML =
      kpiCard('Vélos par marque', String(NB_VELOS), 'vélos répartis', '', false) +
      kpiCard('Marque dominante', dominante, top[0].v + ' vélos chacune', '', false);
    var kmMarqueRaw = sumDimYear(KM_MARQUE_M, CUR_YEAR);
    var kmMarque = topBars(kmMarqueRaw, 10);
    var topKeys = topBrandKeys(5);
    var marqueLines = topKeys.map(function(k){ return { name:k, data:yearSeries(KM_MARQUE_M[k], CUR_YEAR) }; });
    var rows = top.slice(0,8).map(function(o){
      return [o.k, String(o.v), fmtInt(sumMarqueYear(o.k, CUR_YEAR)), (o.v/NB_VELOS*100).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' %']; });
    var chartsList = [
      ['v22a', hbarOption(topBars(MARQUE_VELOS, 10))],
      ['v22b', hbarOption(kmMarque)],
      ['v22c', multiLineOption(marqueLines)]
    ];
    document.getElementById('visuals').innerHTML =
      cardShell('Vélos par marque', 'top 10 + Autres', '<div class="chart-holder"><div class="chart" id="v22a"></div></div>') +
      cardShell('Km par marque', 'année ' + CUR_YEAR, '<div class="chart-holder"><div class="chart" id="v22b"></div></div>') +
      cardShell('Km par mois — top 5 marques', 'année ' + CUR_YEAR, '<div class="chart-holder"><div class="chart" id="v22c"></div></div>') +
      cardShell('Détail par marque', 'top 8', '<div class="table-wrap">' +
        tableHtml(['Marque','Vélos','Km ' + CUR_YEAR,'Part'], rows, [1,2,3]) + '</div>');
    renderCharts(chartsList);
  }
};

function renderNav(){
  var l1 = '';
  NAV.forEach(function(p,pi){
    var cls = pi===state.page ? 'nav-pill active' : 'nav-pill inactive';
    l1 += '<div class="' + cls + '" data-page="' + pi + '">' + p.name + '</div>';
  });
  var l1El = document.getElementById('navL1');
  l1El.innerHTML = l1;
  var page = NAV[state.page];
  var l2 = '';
  page.subs.forEach(function(s,si){
    var cls = si===state.sub ? 'l2-link active' : 'l2-link';
    l2 += '<button class="' + cls + '" data-page="' + state.page + '" data-sub="' + si + '">' + s.name + '</button>';
  });
  document.getElementById('navL2').innerHTML = l2;
  l1El.querySelectorAll('[data-page]').forEach(function(el){
    el.addEventListener('click', function(){ go(parseInt(el.getAttribute('data-page'),10), 0); });
  });
  document.getElementById('navL2').querySelectorAll('[data-sub]').forEach(function(el){
    el.addEventListener('click', function(){
      go(parseInt(el.getAttribute('data-page'),10), parseInt(el.getAttribute('data-sub'),10));
    });
  });
}
function renderPopover(){
  var p = NAV[state.page];
  var h = '<div class="pop-title">' + p.name + '</div><div class="pop-sub">Page active — ' + p.subs[state.sub].name + ' affichée</div>';
  h += '<div class="pop-divider"></div>';
  p.subs.forEach(function(s,si){
    var active = si===state.sub;
    h += '<div class="pop-item' + (active?' active':'') + '"><span class="dot ' + (active?'blue':'pri') + '"></span>' +
      '<span>' + s.name + (active?' <span class="pop-now">(affichée)</span>':'') + '</span></div>' +
      '<div style="font-size:10.5px;color:var(--text-secondary);margin:-2px 0 2px 16px;">' + s.desc + '</div>';
  });
  document.getElementById('popover').innerHTML = h;
}
function toggleClass(el, cls, on){
  if (!el) return;
  if (el.classList){ el.classList.toggle(cls, !!on); return; }
  var re = new RegExp('(^|\\s)' + cls + '(\\s|$)', 'g');
  var c = String(el.className||'');
  if (on){ if (!c.match(re)) el.className = (c + ' ' + cls).trim(); }
  else { el.className = c.replace(re, ' ').trim(); }
}
var FILT = { years:{}, quarter:0, month:0, start:0, end:N_MONTHS-1, pays:'', marque:'', ville:'' };
function isFiltered(){
  for (var y in FILT.years){ if (FILT.years[y]) return true; }
  return FILT.quarter>0 || FILT.month>0 || FILT.start>0 || FILT.end<N_MONTHS-1
      || FILT.pays!=='' || FILT.marque!=='' || FILT.ville!=='';
}
function fmtDate(i){ var m = MONTH_META[i]; return ('0'+m.month).slice(-2) + '/01/' + m.year; }
function parseDateInput(v, def){
  var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(v).trim());
  if (!m) return def;
  var y=parseInt(m[3],10), mo=parseInt(m[2],10);
  for (var i=0;i<N_MONTHS;i++){ if (MONTH_META[i].year===y && MONTH_META[i].month===mo) return i; }
  return def;
}
function buildPane(){
  var years = []; MONTH_META.forEach(function(m){ if (years.indexOf(m.year)<0) years.push(m.year); });
  years.sort();
  var yc = document.getElementById('yearChiclets'); var h = '';
  years.forEach(function(y){ h += '<div class="chiclet" data-year="' + y + '">' + y + '</div>'; });
  yc.innerHTML = h;
  var pc = document.getElementById('paysChiclets'); var hp = '';
  Object.keys(KM_PAYS_M).forEach(function(p){ hp += '<div class="chiclet" data-pays="' + p + '">' + p + '</div>'; });
  pc.innerHTML = hp;
  var ms = document.getElementById('marqueSel'); ms.innerHTML = '<option value="">Toutes les marques</option>';
  Object.keys(MARQUE_VELOS).forEach(function(k){ ms.innerHTML += '<option value="' + k + '">' + k + '</option>'; });
  var vs = document.getElementById('villeSel'); vs.innerHTML = '<option value="">Toutes les villes</option>';
  Object.keys(VILLE_CYCLISTES).forEach(function(k){ vs.innerHTML += '<option value="' + k + '">' + k + '</option>'; });
}
function syncPaneUI(){
  var yc = document.getElementById('yearChiclets');
  if (yc && yc.querySelectorAll){
    yc.querySelectorAll('[data-year]').forEach(function(el){
      toggleClass(el, 'active', !!FILT.years[el.getAttribute('data-year')]);
    });
  }
  var pc = document.getElementById('paysChiclets');
  if (pc && pc.querySelectorAll){
    pc.querySelectorAll('[data-pays]').forEach(function(el){
      toggleClass(el, 'active', FILT.pays===el.getAttribute('data-pays'));
    });
  }
  document.getElementById('quarterSel').value = String(FILT.quarter);
  document.getElementById('monthSel').value = String(FILT.month);
  document.getElementById('marqueSel').value = FILT.marque;
  document.getElementById('villeSel').value = FILT.ville;
  var s=FILT.start, e=FILT.end;
  document.getElementById('rangeStart').value = String(s);
  document.getElementById('rangeEnd').value = String(e);
  document.getElementById('dateStart').value = fmtDate(s);
  document.getElementById('dateEnd').value = fmtDate(e);
  var pctS=s/(N_MONTHS-1)*100, pctE=e/(N_MONTHS-1)*100;
  var fill = document.getElementById('rangeFill');
  fill.style.left = pctS + '%'; fill.style.width = Math.max(0, pctE-pctS) + '%';
  toggleClass(document.getElementById('badge'), 'show', isFiltered());
}
function initFilters(){
  var yc = document.getElementById('yearChiclets');
  if (yc && yc.querySelectorAll){
    yc.querySelectorAll('[data-year]').forEach(function(el){
      el.addEventListener('click', function(){
        var y = el.getAttribute('data-year');
        if (FILT.years[y]){ delete FILT.years[y]; } else { FILT.years[y] = true; }
        syncPaneUI();
      });
    });
  }
  var pc = document.getElementById('paysChiclets');
  if (pc && pc.querySelectorAll){
    pc.querySelectorAll('[data-pays]').forEach(function(el){
      el.addEventListener('click', function(){
        var p = el.getAttribute('data-pays');
        FILT.pays = (FILT.pays===p ? '' : p); syncPaneUI();
      });
    });
  }
  document.getElementById('quarterSel').addEventListener('change', function(ev){
    FILT.quarter = parseInt(ev.target.value,10); if (FILT.quarter>0) FILT.month=0; syncPaneUI();
  });
  document.getElementById('monthSel').addEventListener('change', function(ev){
    FILT.month = parseInt(ev.target.value,10); if (FILT.month>0) FILT.quarter=0; syncPaneUI();
  });
  document.getElementById('marqueSel').addEventListener('change', function(ev){ FILT.marque=ev.target.value; syncPaneUI(); });
  document.getElementById('villeSel').addEventListener('change', function(ev){ FILT.ville=ev.target.value; syncPaneUI(); });
  document.getElementById('rangeStart').addEventListener('input', function(ev){
    var s=parseInt(ev.target.value,10); if (s>FILT.end) FILT.end=s; FILT.start=s; syncPaneUI();
  });
  document.getElementById('rangeEnd').addEventListener('input', function(ev){
    var e2=parseInt(ev.target.value,10); if (e2<FILT.start) FILT.start=e2; FILT.end=e2; syncPaneUI();
  });
  document.getElementById('dateStart').addEventListener('change', function(ev){
    FILT.start = parseDateInput(ev.target.value, FILT.start); if (FILT.start>FILT.end) FILT.end=FILT.start; syncPaneUI();
  });
  document.getElementById('dateEnd').addEventListener('change', function(ev){
    FILT.end = parseDateInput(ev.target.value, FILT.end); if (FILT.end<FILT.start) FILT.start=FILT.end; syncPaneUI();
  });
  document.getElementById('clearBtn').addEventListener('click', function(){
    FILT.years={}; FILT.quarter=0; FILT.month=0; FILT.start=0; FILT.end=N_MONTHS-1;
    FILT.pays=''; FILT.marque=''; FILT.ville=''; syncPaneUI();
  });
}
function renderPage(){
  disposeCharts();
  var agg = aggregates();
  renderNav();
  var key = (state.page+1) + '.' + (state.sub+1);
  VIEWS[key](agg);
  renderPopover();
}
function go(pi, si){
  state.page = pi; state.sub = si;
  renderPage();
}
function fit(){
  var w = window.innerWidth, h = window.innerHeight;
  var s = Math.min(w/1920, h/1080);
  document.getElementById('slide').style.transform =
    'translate(' + ((w-1920*s)/2) + 'px,' + ((h-1080*s)/2) + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fit);
buildPane();
initFilters();
syncPaneUI();
renderPage();
fit();
</script>
