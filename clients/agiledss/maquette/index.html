<style>
  :root{
    --primary:#B69E7F;
    --surface:#FFFFFF;
    --canvas:#F1F5F9;
    --card-bg:#FFFFFF;
    --border:#CBD5E1;
    --text-primary:#0F172A;
    --text-secondary:#64748B;
    --neutral:#94A3B8;
    --on-primary:#FFFFFF;          /* dérivé par JS pour WCAG AA (POWERBI_LAYOUT.md §2) */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0B1220;font-family:Inter,system-ui,-apple-system,sans-serif;}
  #viewport{position:fixed;inset:0;overflow:hidden;}
  .slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;background:var(--canvas);}

  /* ---- En-tête : cassure trapèzes ---- */
  .logo-zone{position:absolute;left:0;top:0;width:320px;height:97px;background:var(--surface);
    clip-path:polygon(0 0,320px 0,244px 97px,0 97px);
    display:flex;align-items:center;justify-content:center;padding-right:36px;z-index:2;}
  .logo-zone img{max-height:70px;max-width:230px;object-fit:contain;}
  .banner{position:absolute;left:0;top:0;width:100%;height:97px;background:var(--primary);
    clip-path:polygon(342px 0,100% 0,100% 97px,267px 97px);z-index:1;}
  #titles{position:absolute;left:360px;right:48px;top:0;height:97px;z-index:3;
    display:flex;flex-direction:column;justify-content:center;text-align:center;}
  #titles h1{font-size:26px;font-weight:700;letter-spacing:.02em;color:var(--on-primary);line-height:1.1;}
  #titles p{font-size:13px;opacity:.92;color:var(--on-primary);margin-top:2px;}

  /* ---- Icône info unique ---- */
  .info-wrap{position:absolute;top:26px;right:16px;z-index:70;}
  .info-ico{width:36px;height:36px;border-radius:9999px;background:var(--surface);color:var(--primary);
    display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;font-family:Georgia,serif;
    cursor:help;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .info-wrap .popover{position:absolute;top:44px;right:0;width:400px;display:none;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:16px;z-index:80;}
  .info-wrap:hover .popover,
  .info-wrap:focus-within .popover{display:block;}
  .popover .pg-title{color:var(--primary);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
  .popover .pg-desc{font-size:12px;color:var(--text-secondary);margin:4px 0 8px;}
  .popover .sub-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 6px;border-radius:6px;cursor:pointer;}
  .popover .sub-row:hover{background:var(--canvas);}
  .popover .sub-row.active{background:var(--canvas);}
  .dot{width:8px;height:8px;border-radius:9999px;flex-shrink:0;}
  .dot.act{background:#3B82F6;}
  .dot.inact{background:var(--primary);}

  /* ---- Pane filtres ---- */
  #filters{position:absolute;left:11px;top:116px;bottom:40px;width:235px;background:var(--surface);
    border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;z-index:5;overflow:hidden;}
  #filters .fh{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  #filters .fh svg{color:var(--primary);}
  #filters .fh span{color:var(--primary);font-size:14px;font-weight:700;}
  .fgroup{display:flex;flex-direction:column;gap:6px;}
  .fgroup .flab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);}
  .chiclets{display:flex;flex-wrap:wrap;gap:6px;}
  .chic{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--canvas);
    color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;transition:all .15s;}
  .chic[data-on="1"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600;}
  .fdrop{height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);
    font-size:12px;font-weight:500;padding:0 8px;width:100%;cursor:pointer;}
  .drwrap{position:relative;height:32px;}
  .drwrap .dr-handle-input{position:absolute;inset:0;width:100%;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;}
  .drwrap .dr-handle-input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:all;width:16px;height:16px;border-radius:9999px;background:var(--surface);border:2px solid var(--primary);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .drwrap input[type="text"]{display:none;}
  .dr-show{display:flex;gap:6px;}
  .dr-show input{flex:1;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);font-size:12px;font-weight:500;text-align:center;}
  #filtBadge{align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--primary);padding:0 2px;display:none;}
  #btnClear{margin-top:auto;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
  #btnClear:hover{border-color:var(--primary);color:var(--text-primary);}

  /* ---- Contenu ---- */
  .content{position:absolute;left:262px;top:97px;right:0;bottom:40px;
    padding:8px 20px 0 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;}
  #navL1{display:flex;gap:12px;}
  .pill{flex:1;padding:10px 16px;border-radius:8px;font-size:12px;text-align:center;cursor:pointer;transition:all .15s;border:1px solid transparent;}
  .pill.inact{background:var(--surface);color:var(--text-secondary);border-color:var(--border);font-weight:500;}
  .pill.inact:hover{background:var(--canvas);}
  .pill.act{background:var(--primary);color:var(--on-primary);font-weight:600;cursor:default;}
  #navL2{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border);min-height:32px;}
  .l2{font-size:12px;padding-bottom:4px;cursor:pointer;font-weight:500;color:var(--text-secondary);border:0;background:none;}
  .l2:hover{color:var(--text-primary);}
  .l2.act{color:var(--primary);font-weight:600;border-bottom:2px solid var(--primary);padding-bottom:4px;cursor:default;}
  #kpis{display:flex;gap:12px;}
  #visuals{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;}
  .vcard{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
    display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.04);min-height:0;}
  .vhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .vhead .vt{font-size:13px;font-weight:600;color:var(--text-primary);}
  .vhead .vs{font-size:11px;color:var(--text-secondary);}
  .chart-holder{position:relative;flex:1;min-height:0;}
  .chart{position:absolute;inset:0;}
  .donut-center{position:absolute;left:35%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;line-height:1;text-align:center;}
  .donut-center .dc-value{font-size:22px;font-weight:700;color:var(--text-primary);}
  .donut-center .dc-sub{font-size:11px;color:var(--text-secondary);margin-top:4px;}

  footer{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;justify-content:center;
    background:var(--canvas);border-top:1px solid var(--border);color:var(--text-secondary);font-size:11px;z-index:5;}
</style>

<script>
/* ============ SCALING ============ */
(function(){
  var vp = document.getElementById('viewport');
  var slide = document.getElementById('slide');
  function fit(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var s = Math.min(vw/1920, vh/1080);
    var tx = (vw-1920*s)/2, ty = (vh-1080*s)/2;
    slide.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+s+')';
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>

/* ============ THEME (palette dérivée du primaire) ============ */
function hexToHsl(hex){
  const h=hex.replace('#',''), r=parseInt(h.substr(0,2),16)/255, g=parseInt(h.substr(2,2),16)/255, b=parseInt(h.substr(4,2),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let hh,s,l=(mx+mn)/2;
  if(mx===mn){hh=0;s=0;} else {
    const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case r:hh=(g-b)/d+(g<b?6:0);break;case g:hh=(b-r)/d+2;break;default:hh=(r-g)/d+4;}
    hh*=60;
  }
  return [hh,s*100,l*100];
}
function hslToHex(h,s,l){
  s/=100;l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const tx=x=>Math.round(x*255).toString(16).padStart(2,'0');
  return '#'+tx(f(0))+tx(f(8))+tx(f(4));
}
function derivePalette(primary){
  const [h,s,l]=hexToHsl(primary);
  return [primary, hslToHex(h,s,Math.max(15,l-18)), hslToHex(h,Math.max(10,s-12),Math.min(92,l+15)), hslToHex((h+28)%360,Math.max(18,s-8),Math.min(62,l)), hslToHex((h+180)%360,Math.max(14,s-22),Math.min(55,l)), hslToHex(h,Math.max(8,s-28),l)];
}

function _hexCh(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function _lin(c){ c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
function relLum(hex){ const [r,g,b]=_hexCh(hex); return 0.2126*_lin(r)+0.7152*_lin(g)+0.0722*_lin(b); }
function contrast(a,b){ const L1=relLum(a),L2=relLum(b); const hi=Math.max(L1,L2),lo=Math.min(L1,L2); return (hi+0.05)/(lo+0.05); }
const ON_PRIMARY = contrast(C.surface, C.primary) >= 4.5 ? C.surface : C.text;

function yearSeries(arr, year){
  const out=new Array(12).fill(null);
  for(let i=0;i<N_MONTHS;i++){ const m=MONTH_META[i]; if(m.year===year) out[m.month-1]=arr[i]; }
  return out;
}
function yearRatio(num, den, year){
  const out=new Array(12).fill(null);
  for(let i=0;i<N_MONTHS;i++){ const m=MONTH_META[i]; if(m.year===year && den[i]) out[m.month-1]=num[i]/den[i]; }
  return out;
}
function sumYear(dict, year){
  const out={};
  for(const k of Object.keys(dict)){ let s=0; for(let i=0;i<N_MONTHS;i++){ if(MONTH_META[i].year===year) s+=dict[k][i]; } out[k]=s; }
  return out;
}
function topDonut(dict, topN){
  const arr=Object.keys(dict).map(k=>({name:k,value:dict[k]})).sort((a,b)=>b.value-a.value);
  const head=arr.slice(0,topN);
  const rest=arr.slice(topN).reduce((s,d)=>s+d.value,0);
  if(rest>0) head.push({name:'Autres',value:rest});
  return head;
}
function topBars(dict, topN){
  const arr=Object.keys(dict).map(k=>({name:k,value:dict[k]})).sort((a,b)=>b.value-a.value);
  const head=arr.slice(0,topN);
  const rest=arr.slice(topN).reduce((s,d)=>s+d.value,0);
  if(rest>0) head.push({name:'Autres',value:rest});
  return head;
}

/* ============ AGGREGATES (année N vs N-1, mois comparables) ============ */
function aggregates(){
  const nMonths=[], pMonths=[];
  for(let i=0;i<N_MONTHS;i++){
    if(MONTH_META[i].year===CUR_YEAR) nMonths.push(i);
    else if(MONTH_META[i].year===PREV_YEAR) pMonths.push(i);
  }
  const nmSet = nMonths.map(i=>MONTH_META[i].month);
  const pCmp = pMonths.filter(i=>nmSet.includes(MONTH_META[i].month));
  let cKm=0,pKm=0,cRides=0,pRides=0,cMin=0,pMin=0;
  for(const i of nMonths){ cKm+=KM[i]; cRides+=RIDES[i]; cMin+=MINUTES[i]; }
  for(const i of pCmp){ pKm+=KM[i]; pRides+=RIDES[i]; pMin+=MINUTES[i]; }
  let nMask=0, pMask=0;
  for(const i of nMonths) nMask |= (1<<i);
  for(const i of pCmp) pMask |= (1<<i);
  let cActifs=0, pActifs=0;
  for(const k of Object.keys(USER_MASKS)){ const mk=USER_MASKS[k]|0; if(mk&nMask) cActifs++; if(mk&pMask) pActifs++; }
  return { cKm,pKm,cRides,pRides,cMin,pMin,cActifs,pActifs };
}

const fInt = v => Math.round(v).toLocaleString('fr-FR');
const fKm  = v => v>=1000 ? (v/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' k' : fInt(v);
const f1   = v => v.toLocaleString('fr-FR',{maximumFractionDigits:1});
function trendBadge(v){
  if(v===null||!isFinite(v)) return '';
  const y = String(PREV_YEAR);
  if(Math.abs(v)<1){
    return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold border bg-slate-100 text-slate-600 border-slate-200">≈ stable vs ${y}</span>`;
  }
  const s = v>=0?'+':'−';
  const t = `${s}${Math.abs(v).toLocaleString('fr-FR',{maximumFractionDigits:1})} % vs ${y}`;
  const cls = v>=0 ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-rose-100 text-rose-800 border-rose-200';
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold border ${cls}">${t}</span>`;
}

}

const NAV = [
  { name:'Cyclistes', desc:'Pilotage de l\'activité cycliste : effectifs, distances et sorties.', subs:[
    { name:'Vue d\'ensemble', view:'vo' },
    { name:'Répartition géographique', view:'geo' },
    { name:'Affectations vélos', view:'aff' }
  ]},
  { name:'Flotte vélos', desc:'Composition et usure du parc de vélos, répartition par marque.', subs:[
    { name:'Vue d\'ensemble', view:'fvo' },
    { name:'Répartition par marque', view:'fma' }
  ]}
];
let state = { page:0, sub:0 };

function disposeCharts(){ for(const k of Object.keys(charts)) charts[k].dispose(); charts = {}; }
function renderCharts(list){
  requestAnimationFrame(() => {
    list.forEach(([id,opt])=>{
      const el=document.getElementById(id);
      if(!el) return;
      charts[id]=echarts.init(el);
      charts[id].setOption(opt);
    });
  });
}

function renderNav(){
  const L1=document.getElementById('navL1');
  L1.innerHTML = NAV.map((p,i)=>`<div class="pill ${i===state.page?'act':'inact'}" data-p="${i}">${p.name}</div>`).join('');
  Array.prototype.forEach.call(L1.querySelectorAll('.pill'),(el)=>{
    el.addEventListener('click',()=>{ const p=+(el.getAttribute('data-p')); state.page=p; state.sub=0; renderPage(); });
  });
  const L2=document.getElementById('navL2');
  const subs=NAV[state.page].subs;
  L2.innerHTML = subs.map((s,i)=>`<button class="l2 ${i===state.sub?'act':''}" data-s="${i}">${s.name}</button>`).join('');
  Array.prototype.forEach.call(L2.querySelectorAll('.l2'),(el)=>{
    el.addEventListener('click',()=>{ state.sub=+(el.getAttribute('data-s')); renderPage(); });
  });
  const pop=document.getElementById('infoPop');
  const page=NAV[state.page];
  pop.innerHTML = `
    <div class="pg-title">Page : ${page.name}</div>
    <div class="pg-desc">${page.desc}</div>
    ${page.subs.map((s,i)=>`
      <div class="sub-row ${i===state.sub?'active':''}" data-s="${i}" role="button" tabindex="0">
        <span class="dot ${i===state.sub?'act':'inact'}"></span>
        <span style="${i===state.sub?'font-weight:600;color:var(--text-primary);':'color:var(--text-secondary);'}">${s.name}</span>
        <span style="margin-left:auto;color:var(--text-secondary);font-size:11px;">${i===state.sub?'<b>page active</b>':'sous-page'}</span>
      </div>`).join('')}`;
  Array.prototype.forEach.call(pop.querySelectorAll('.sub-row'),(row)=>{
    const onGo=()=>{ const s=+(row.getAttribute('data-s')); go(state.page, s); };
    row.addEventListener('click',onGo);
    row.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onGo(); } });
  });
}

function renderPage(){

function go(pi, si){ state.page=pi; state.sub=si; renderPage(); }

/* ============ PANE FILTRES (interactif, non lié aux données) ============ */
const DR_DEF = { from:'01/01/2024', to:'01/07/2025' };
const FILT = { years:[], qtr:[], mo:'', drFrom:DR_DEF.from, drTo:DR_DEF.to, pays:[], usure:[], ville:'', marque:'' };
const CHIC_BUCKET = { 'fAnnée':'years', 'fPays':'pays', 'fUsure':'usure', 'fQtr':'qtr' };
function paintChiclets(id, values){
  const el=document.getElementById(id);
  el.innerHTML = values.map((v,i)=>`<span class="chic" data-v="${i}" data-on="0">${v}</span>`).join('');
  const single = id==='fQtr';                       // trimestre = sélection unique, exclusive avec Mois
  Array.prototype.forEach.call(el.querySelectorAll('.chic'),(span)=>{
    span.addEventListener('click',()=>{
      const bucket = CHIC_BUCKET[id];
      const val = values[+span.getAttribute('data-v')];
      const arr = FILT[bucket];
      if(single){
        // réinitialise les autres chiclets du groupe (sélection unique)
        Array.prototype.forEach.call(el.querySelectorAll('.chic'),c=>{
          if(c!==span){ c.setAttribute('data-on','0'); }
        });
        arr.length = 0;
      }
      const turningOn = span.getAttribute('data-on')!=='1';
      span.setAttribute('data-on', turningOn?'1':'0');
      if(turningOn){ arr.push(val); } else { const idx=arr.indexOf(val); if(idx>=0) arr.splice(idx,1); }
      if(single && turningOn){                            // trimestre ⇄ mois exclusifs
        FILT.mo=''; document.getElementById('fMo').value='';
      }
      refreshBadge();
    });
  });
}
function refreshBadge(){
  const on = FILT.years.length>0 || FILT.qtr.length>0 || FILT.mo ||
             FILT.pays.length>0 || FILT.usure.length>0 || FILT.ville || FILT.marque ||
             FILT.drFrom!==DR_DEF.from || FILT.drTo!==DR_DEF.to;
  document.getElementById('filtBadge').style.display = on ? 'inline-flex' : 'none';
}
function bindSelect(id, key){
  const el=document.getElementById(id);
  el.addEventListener('change',()=>{
    FILT[key]=el.value || '';
    if(key==='mo' && FILT.mo){                           // mois ⇄ trimestre exclusifs
      FILT.qtr=[];
      const q=document.getElementById('fQtr');
      if(q) Array.prototype.forEach.call(q.querySelectorAll('.chic'),c=>c.setAttribute('data-on','0'));
    }
    refreshBadge();
  });
}
(function initFilters(){
  paintChiclets('fAnnée',[String(PREV_YEAR),String(CUR_YEAR)]);           // ordre chronologique
  paintChiclets('fQtr',['T1','T2','T3','T4']);                            // chiclets (≤ 4 valeurs)
  paintChiclets('fPays', Object.keys(PAYS_CYCLISTES));
  paintChiclets('fUsure', Object.keys(USURE_STATUT).map(LBL));
  const ville=document.getElementById('fVille');
  Object.keys(VILLE_CYCLISTES).forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; ville.appendChild(o); });
  const marque=document.getElementById('fMarque');
  Object.keys(MARQUE_VELOS).forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; marque.appendChild(o); });
  bindSelect('fMo','mo');
  bindSelect('fVille','ville');
  bindSelect('fMarque','marque');
  const drFrom=document.getElementById('drFrom'), drTo=document.getElementById('drTo');
  drFrom.addEventListener('change',()=>{ FILT.drFrom=drFrom.value||DR_DEF.from; refreshBadge(); });
  drTo.addEventListener('change',()=>{ FILT.drTo=drTo.value||DR_DEF.to; refreshBadge(); });
  document.getElementById('btnClear').addEventListener('click',()=>{
    FILT.years=[]; FILT.qtr=[]; FILT.mo=''; FILT.pays=[]; FILT.usure=[]; FILT.ville=''; FILT.marque='';
    FILT.drFrom=DR_DEF.from; FILT.drTo=DR_DEF.to;
    ['fAnnée','fPays','fUsure','fQtr'].forEach(id=>{
      Array.prototype.forEach.call(document.getElementById(id).querySelectorAll('.chic'),c=>c.setAttribute('data-on','0'));
    });
    ['fMo','fVille','fMarque'].forEach(id=>{ document.getElementById(id).value=''; });
    drFrom.value=DR_DEF.from; drTo.value=DR_DEF.to;
    refreshBadge();
  });
  refreshBadge();
})();

renderPage();
</script>
