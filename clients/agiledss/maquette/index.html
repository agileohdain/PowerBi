<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELOH — Pilotage de flotte cyclable</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --primary:#B69E7F; --surface:#FFFFFF; --canvas:#F1F5F9;
    --card-bg:#FFFFFF; --border:#CBD5E1;
    --text-primary:#0F172A; --text-secondary:#64748B;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;}
  #viewport{position:fixed;inset:0;overflow:hidden;}
  #slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;
    background:var(--canvas);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text-primary);}
  /* --- En-tête : zone logo + bannière en trapèzes (cassure diagonale) --- */
  .logo-zone{position:absolute;left:0;top:0;width:320px;height:97px;background:var(--surface);
    clip-path:polygon(0 0,320px 0,244px 97px,0 97px);display:flex;align-items:center;justify-content:center;
    padding-right:36px;box-sizing:border-box;}
  .logo-zone img{max-height:70px;max-width:200px;object-fit:contain;}
  .banner{position:absolute;left:0;top:0;width:1920px;height:97px;background:var(--primary);
    clip-path:polygon(342px 0,100% 0,100% 97px,267px 97px);}
  .banner-title{position:absolute;left:360px;right:110px;top:0;height:97px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:var(--surface);pointer-events:none;}
  .banner-title h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em;}
  .banner-title p{margin:3px 0 0;font-size:13px;opacity:.92;}
  /* --- Icône info unique + popover au survol (conteneur partagé) --- */
  .info-wrap{position:absolute;top:26px;right:16px;z-index:70;}
  .info-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--primary);
    display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-family:Georgia,serif;
    font-weight:800;cursor:help;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .info-wrap .popover{position:absolute;top:44px;right:0;width:400px;display:none;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;}
  .info-wrap:hover .popover{display:block;}
  .popover h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.04em;}
  .popover .pdesc{font-size:12px;color:var(--text-secondary);margin:0 0 8px;line-height:1.4;}
  .popover .sub-item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--border);}
  .popover .dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;background:var(--primary);}
  .popover .dot.active{background:#2563EB;}
  .popover .sub-name{font-size:12px;font-weight:600;color:var(--text-primary);}
  .popover .sub-name.active{color:#2563EB;}
  .popover .sub-desc{font-size:11px;color:var(--text-secondary);line-height:1.35;}
  /* --- Pane filtres flottant --- */
  #filters{position:absolute;left:11px;top:116px;width:235px;bottom:44px;background:var(--surface);
    border-radius:10px;padding:16px;box-sizing:border-box;overflow-y:auto;}
  .f-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:12px;
    border-bottom:1px solid var(--border);color:var(--primary);font-weight:600;font-size:14px;}
  .f-head svg{width:16px;height:16px;stroke:var(--primary);}
  #fBadge{margin-left:auto;font-size:10px;font-weight:600;color:var(--primary);}
  .f-group{margin-bottom:14px;}
  .f-group>label{display:block;font-size:11px;font-weight:600;color:var(--text-secondary);
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .chics{display:flex;flex-wrap:wrap;gap:6px;}
  .chic{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;background:var(--canvas);
    color:var(--text-secondary);border:1px solid var(--border);cursor:pointer;transition:all .15s;}
  .chic:hover{background:var(--border);}
  .chic.active{background:var(--primary);color:var(--surface);border-color:var(--primary);font-weight:600;}
  .f-group select{width:100%;padding:7px 10px;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;font-size:12px;color:var(--text-primary);outline:none;}
  .f-group select:focus{border-color:var(--primary);}
  .range-wrap{position:relative;height:26px;margin-bottom:8px;}
  .range-wrap .track{position:absolute;top:11px;left:0;right:0;height:6px;background:var(--border);border-radius:3px;}
  .range-wrap .fill{position:absolute;top:11px;height:6px;background:var(--primary);border-radius:3px;}
  .range-wrap input[type=range]{position:absolute;top:5px;left:0;width:100%;-webkit-appearance:none;appearance:none;
    background:transparent;pointer-events:none;height:16px;margin:0;}
  .range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;
    border-radius:50%;background:var(--surface);border:2px solid var(--primary);pointer-events:auto;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .range-wrap input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);
    border:2px solid var(--primary);pointer-events:auto;cursor:pointer;}
  .dates{display:flex;gap:6px;}
  .dates input{flex:1;min-width:0;padding:4px 6px;font-size:11px;border:1px solid var(--border);border-radius:5px;
    background:var(--surface);color:var(--text-primary);}
  .dates input:focus{outline:none;border-color:var(--primary);}
  #btnClear{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px;
    font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--surface);
    border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;}
  #btnClear:hover{background:var(--canvas);color:var(--text-primary);border-color:var(--primary);}
  /* --- Contenu principal (sous le bandeau, jamais par-dessus) --- */
  .content{position:absolute;left:262px;top:97px;right:0;bottom:40px;padding:0 20px 0 16px;
    display:flex;flex-direction:column;box-sizing:border-box;}
  /* --- KPI cards --- */
  .kpi{position:relative;overflow:hidden;background:var(--card-bg);border:1px solid var(--border);
    border-radius:8px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.05);display:flex;flex-direction:column;}
  .kpi .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);}
  .kpi .k-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:4px;}
  .kpi .k-value{font-size:28px;font-weight:700;color:var(--text-primary);letter-spacing:-.01em;margin:2px 0;}
  .kpi .k-sub{font-size:11px;color:var(--text-secondary);}
  .kpi .k-foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:6px;min-height:22px;}
  .trend{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
  .trend.up{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0;}
  .trend.down{background:#FFF1F2;color:#9F1239;border:1px solid #FECDD3;}
  .kpi.consol{border:2px dashed #FF0000;}
  .consol-flag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#FF0000;
    background:rgba(255,0,0,.08);padding:2px 6px;border-radius:4px;}
  /* --- Visuels --- */
  .vcard{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;
    box-shadow:0 1px 2px rgba(15,23,42,.05);display:flex;flex-direction:column;min-height:0;}
  .vcard .v-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;
    border-bottom:1px solid var(--border);padding-bottom:6px;}
  .vcard .v-title{font-size:13px;font-weight:600;color:var(--text-primary);}
  .vcard .v-sub{font-size:11px;color:var(--text-secondary);}
  .chart-holder{position:relative;flex:1;min-height:0;}
  .chart-holder .chart{position:absolute;inset:0;}
  .donut-center{position:absolute;left:30%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;
    align-items:center;pointer-events:none;line-height:1;text-align:center;}
  .donut-center .dc-value{font-size:22px;font-weight:700;color:var(--text-primary);}
  .donut-center .dc-sub{font-size:11px;color:var(--text-secondary);margin-top:4px;}
  /* --- Table --- */
  .vtable{width:100%;border-collapse:collapse;text-align:left;}
  .vtable thead th{background:var(--primary);color:var(--surface);font-weight:600;font-size:11px;
    padding:8px 12px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;}
  .vtable tbody tr{transition:background .12s;}
  .vtable tbody tr:nth-child(odd){background:var(--canvas);}
  .vtable tbody tr:nth-child(even){background:var(--card-bg);}
  .vtable tbody tr:hover{background:var(--border);}
  .vtable tbody td{padding:7px 12px;font-size:12px;color:var(--text-primary);border-bottom:1px solid var(--border);}
  .vtable td.num{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  /* --- Footer --- */
  #footer{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--text-secondary);background:var(--canvas);border-top:1px solid var(--border);}
</style>
</head>

<div id="viewport">
  <div id="slide">
    <div class="banner"></div>
    <div class="logo-zone"><img src="../logo.png" alt="agiledss"></div>
    <div class="banner-title">
      <h1>VELOH — Pilotage de flotte cyclable</h1>
      <p>Cyclistes · Flotte · Sorties · Composants — Janv. 2024 – Juil. 2025</p>
    </div>

      <div class="popover" id="infoPopover"></div>
    </div>

      <div class="f-head">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </svg>
        Filtres

      </div>

          <option value="4">T4</option>

        <div class="dates">

          <path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 4 3 9 8 9"></polyline>
        </svg>
        Effacer les filtres
      </button>
    </aside>

    <main class="content">
      <div id="navL1" class="flex flex-row gap-3 w-full my-2"></div>
      <div id="navL2" class="flex flex-row items-center gap-6 w-full mb-3 pb-1" style="border-bottom:1px solid var(--border);"></div>
      <div id="kpis" class="grid gap-3 mb-3" style="height:130px;"></div>
      <div id="visuals" class="grid gap-3" style="flex:1;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;"></div>
    </main>

    <div id="footer">Données fictives — Maquette Power BI haute fidélité.</div>
  </div>
</div>

/* ---------- Formatage ---------- */
const fmtInt = v => Math.round(v).toLocaleString('fr-FR');
const fmtKm  = v => v >= 10000 ? (v/1000).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' k km'
                               : Math.round(v).toLocaleString('fr-FR') + ' km';
const fmtMin = v => Math.round(v).toLocaleString('fr-FR') + ' min';
const r1 = v => Math.round(v*10)/10;

/* =====================================================================
   ÉTAT DES FILTRES — source de vérité unique (§2.7)
   ===================================================================== */
const FILT = { years:new Set(), quarter:0, month:0, start:0, end:N_MONTHS-1 };
function monthPass(i){ const m = MONTH_META[i];
  if (FILT.years.size && !FILT.years.has(m.year)) return false;
  if (FILT.quarter && m.quarter !== FILT.quarter) return false;
  if (FILT.month   && m.month   !== FILT.month  ) return false;
  return i >= FILT.start && i <= FILT.end; }
function isFiltered(){ return FILT.years.size>0 || FILT.quarter>0 || FILT.month>0 ||
                              FILT.start>0 || FILT.end<N_MONTHS-1; }

/* ---------- Agrégats (point d'entrée unique de recalcul) ---------- */
function countActive(mask){
  let n = 0;
  for (const k in USER_MASKS) if (USER_MASKS[k] & mask) n++;
  return n;
}
function sumIdx(arr, idx){ let s = 0; idx.forEach(i => s += arr[i]); return s; }

function aggregates(){
  const idx = [];
  for (let i = 0; i < N_MONTHS; i++) if (monthPass(i)) idx.push(i);
  let periodMask = 0; idx.forEach(i => periodMask |= (1 << i));

  let km = 0, rides = 0, minutes = 0;
  const mLabels = [], mKm = [], mRides = [], mMin = [], mActifs = [];
  idx.forEach(i => {
    km += KM[i]; rides += RIDES[i]; minutes += MINUTES[i];
    mLabels.push(mLabel(i)); mKm.push(r1(KM[i])); mRides.push(RIDES[i]); mMin.push(MINUTES[i]);
    mActifs.push(countActive(1 << i));
  });
  const actifs = countActive(periodMask);

  /* YoY : mois comparables i vs i-12 (jamais année partielle vs complète) */
  let cMask = 0, pMask = 0;
  idx.forEach(i => { if (i >= 12) { cMask |= (1 << i); pMask |= (1 << (i-12)); } });
  let cKm = 0, pKm = 0, cRides = 0, pRides = 0, cMin = 0, pMin = 0;
  for (let i = 0; i < N_MONTHS; i++){
    if (cMask & (1 << i)) { cKm += KM[i]; cRides += RIDES[i]; cMin += MINUTES[i]; }
    if (pMask & (1 << i)) { pKm += KM[i]; pRides += RIDES[i]; pMin += MINUTES[i]; }
  }
  const yoy = { has:cMask !== 0, cKm, pKm, cRides, pRides, cMin, pMin,
                cActifs:countActive(cMask), pActifs:countActive(pMask) };

  /* Dimensions filtrées */
  const paysNames  = Object.keys(KM_PAYS_M);
  const paysKm     = paysNames.map(p => r1(sumIdx(KM_PAYS_M[p], idx)));
  const paysRides  = paysNames.map(p => sumIdx(RIDES_PAYS_M[p], idx));
  const paysKmM    = paysNames.map(p => ({ name:p, data:idx.map(i => r1(KM_PAYS_M[p][i])) }));
  const marqNames  = Object.keys(KM_MARQUE_M).sort((a,b) =>
                       sumIdx(KM_MARQUE_M[b], idx) - sumIdx(KM_MARQUE_M[a], idx));
  const marqKm     = marqNames.map(m => r1(sumIdx(KM_MARQUE_M[m], idx)));
  const marqKmM    = marqNames.map(m => ({ name:m, data:idx.map(i => r1(KM_MARQUE_M[m][i])) }));

  return { idx, km, rides, minutes, actifs, mLabels, mKm, mRides, mMin, mActifs, yoy,
           paysNames, paysKm, paysRides, paysKmM, marqNames, marqKm, marqKmM };
}

function kpiCard(k, agg){
  const v = agg.yoy.has ? k.trend(agg) : null;
  let badge = '';
  if (v !== null && isFinite(v)){
    const up = v >= 0;
    badge = '<span class="trend ' + (up ? 'up' : 'down') + '">' +
            (up ? '+' : '−') + Math.abs(v).toLocaleString('fr-FR',{maximumFractionDigits:1}) + ' % vs N-1</span>';
  }
  const flag = k.consol ? '<span class="consol-flag">Indicateur en consolidation</span>' : '';
  return '<div class="kpi' + (k.consol ? ' consol' : '') + '">' +
    '<div class="accent"></div>' +
    '<div class="k-label">' + k.label + '</div>' +
    '<div class="k-value">' + k.val(agg) + '</div>' +
    '<div class="k-sub">' + k.sub + '</div>' +
    '<div class="k-foot">' + badge + flag + '</div></div>';
}
function setKpis(view, agg){
  const list = KPIS[view];
  const el = document.getElementById('kpis');
  el.style.gridTemplateColumns = 'repeat(' + list.length + ', 1fr)';
  el.innerHTML = list.map(k => kpiCard(k, agg)).join('');
}

    tooltip:TIP, grid:GRID,
    legend:{ top:0, textStyle:{ color:C.text2, fontSize:11 } },

    yAxis:Object.assign({ type:'value' }, AX, SPL),
    series:series.map((s, i) => ({ name:s.name, type:'bar', stack:'total', data:s.data,
      barMaxWidth:22, itemStyle:{ color:PAL[i % PAL.length] } })) };
}
function hbarOpt(names, values){
  return { backgroundColor:'transparent', textStyle:{ fontFamily:'Inter, system-ui, sans-serif' },
    tooltip:Object.assign({}, TIP, { trigger:'item' }), grid:{ top:10, right:56, bottom:10, left:10, containLabel:true },
    xAxis:Object.assign({ type:'value' }, AX, SPL),
    yAxis:Object.assign({ type:'category', data:names.slice().reverse(), axisLabel:{ color:C.text2, fontSize:11 } },
                        { axisLine:AX.axisLine, axisTick:AX.axisTick }),
    series:[{ type:'bar', data:values.slice().reverse(), barHeight:14,
      itemStyle:{ color:C.primary, borderRadius:[0,4,4,0] },
      label:{ show:true, position:'right', fontSize:11, fontWeight:'bold', color:C.text, distance:6 } }] };
}
function donutOpt(items){
  return { backgroundColor:'transparent', textStyle:{ fontFamily:'Inter, system-ui, sans-serif' },
    tooltip:Object.assign({}, TIP, { trigger:'item' }),
    legend:{ orient:'vertical', right:8, top:'center', itemGap:10, textStyle:{ color:C.text2, fontSize:11 } },
    series:[{ type:'pie', radius:['52%','72%'], center:['30%','50%'],
      data:items.map((d, i) => ({ name:d.name, value:d.value, itemStyle:{ color:PAL[i % PAL.length] } })),
      label:{ show:true, formatter:'{d} %', fontSize:10, color:C.text2, distanceToLabelLine:5 },
      labelLine:{ length:8, length2:6 } }] };
}
function renderCharts(list){
  requestAnimationFrame(() => {
    list.forEach(pair => {
      const el = document.getElementById(pair[0]);
      if (el){ charts[pair[0]] = echarts.init(el); charts[pair[0]].setOption(pair[1]); }
    });
  });
}

/* =====================================================================
   VUES — une entrée par sous-page de CLIENT.md
   ===================================================================== */
const USURE_ITEMS = Object.keys(USURE_STATUT).map(k => ({
  name: k === 'Depasse' ? 'Dépassé' : k, value: USURE_STATUT[k] }));
const NB_COMPOSANTS = USURE_ITEMS.reduce((s, d) => s + d.value, 0);

const VIEWS = {
  /* --- Page 1 · Vue d'ensemble --- */
  '1-0': function(agg){
    setKpis('1-0', agg);
    document.getElementById('visuals').innerHTML =
      vcard('c10a', 'Kilomètres par mois', 'km') +
      vcard('c10b', 'Sorties par mois', 'nombre') +
      vcard('c10c', 'Kilomètres par pays', 'part du total', donutOverlay(fmtKm(agg.km), 'kilomètres')) +
      vcard('c10d', 'Cyclistes actifs par mois', 'entités actives');
    renderCharts([
      ['c10a', lineOpt(agg.mLabels, agg.mKm, C.primary, true)],
      ['c10b', barOpt(agg.mLabels, agg.mRides, C.primary)],
      ['c10c', donutOpt(agg.paysNames.map((n, i) => ({ name:n, value:agg.paysKm[i] })))],
      ['c10d', barOpt(agg.mLabels, agg.mActifs, '#7C6A53')]
    ]);
  },
  /* --- Page 1 · Répartition géographique --- */
  '1-1': function(agg){
    setKpis('1-1', agg);
    const villes = Object.keys(VILLE_CYCLISTES).slice(0, 8);
    document.getElementById('visuals').innerHTML =
      vcard('c11a', 'Cyclistes par pays', 'inscrits') +
      vcard('c11b', 'Top villes', 'cyclistes inscrits') +
      vcard('c11c', 'Kilomètres mensuels par pays', 'km empilés') +
      vcard('c11d', 'Sorties par pays', 'part du total', donutOverlay(fmtInt(agg.rides), 'sorties'));
    renderCharts([
      ['c11a', hbarOpt(Object.keys(PAYS_CYCLISTES), Object.values(PAYS_CYCLISTES))],
      ['c11b', hbarOpt(villes, villes.map(v => VILLE_CYCLISTES[v]))],
      ['c11c', stackBarOpt(agg.mLabels, agg.paysKmM)],
      ['c11d', donutOpt(agg.paysNames.map((n, i) => ({ name:n, value:agg.paysRides[i] })))]
    ]);
  },
  /* --- Page 1 · Affectations vélos --- */
  '1-2': function(agg){
    setKpis('1-2', agg);
    const kmPc = agg.mKm.map((k, i) => agg.mActifs[i] ? r1(k / agg.mActifs[i]) : 0);
    const marques = Object.keys(MARQUE_VELOS).slice(0, 8);
    document.getElementById('visuals').innerHTML =
      vcard('c12a', 'Vélos attribués vs disponibles', 'parc de ' + NB_VELOS + ' vélos',
            donutOverlay(fmtInt(VELOS_ATTRIBUES), 'vélos attribués')) +
      vcard('c12b', 'Marques du parc (top 8)', 'vélos') +
      vcard('c12c', 'Km mensuels par cycliste actif', 'km / actif') +
      vcard('c12d', 'Usure des composants', NB_COMPOSANTS + ' composants suivis',
            donutOverlay(fmtInt(NB_COMPOSANTS), 'composants'));
    renderCharts([
      ['c12a', donutOpt([{ name:'Attribués', value:VELOS_ATTRIBUES },
                         { name:'Disponibles', value:NB_VELOS - VELOS_ATTRIBUES }])],
      ['c12b', hbarOpt(marques, marques.map(m => MARQUE_VELOS[m]))],
      ['c12c', lineOpt(agg.mLabels, kmPc, C.primary, true)],
      ['c12d', donutOpt(USURE_ITEMS)]
    ]);
  },
  /* --- Page 2 · Vue d'ensemble flotte --- */
  '2-0': function(agg){
    setKpis('2-0', agg);
    const marques = Object.keys(MARQUE_VELOS).slice(0, 10);
    document.getElementById('visuals').innerHTML =
      vcard('c20a', 'Vélos par marque (top 10)', 'parc') +
      vcard('c20b', 'État d\'usure des composants', 'statut d\'alerte',
            donutOverlay(fmtInt(NB_COMPOSANTS), 'composants')) +
      vcard('c20c', 'Kilomètres parcourus par mois', 'km flotte') +
      vcard('c20d', 'Km mensuels — top marques', 'km empilés');
    renderCharts([
      ['c20a', hbarOpt(marques, marques.map(m => MARQUE_VELOS[m]))],
      ['c20b', donutOpt(USURE_ITEMS)],
      ['c20c', lineOpt(agg.mLabels, agg.mKm, C.primary, true)],
      ['c20d', stackBarOpt(agg.mLabels, agg.marqKmM.slice(0, 4))]
    ]);
  },
  /* --- Page 2 · Répartition par marque --- */
  '2-1': function(agg){
    setKpis('2-1', agg);
    const marques = Object.keys(MARQUE_VELOS).slice(0, 12);
    const topKm = agg.marqNames.slice(0, 6);
    const topKmItems = topKm.map(m => ({ name:m, value:agg.marqKm[agg.marqNames.indexOf(m)] }));
    const autresKm = r1(agg.marqKm.slice(6).reduce((s, v) => s + v, 0));
    if (autresKm > 0) topKmItems.push({ name:'Autres', value:autresKm });
    const rows = agg.marqNames.slice(0, 10).map(m => {
      const km = agg.marqKm[agg.marqNames.indexOf(m)];
      const nb = MARQUE_VELOS[m] || 0;
      const part = agg.km ? (km / agg.km * 100).toLocaleString('fr-FR',{maximumFractionDigits:1}) : '0';
      return '<tr><td>' + m + '</td><td class="num">' + fmtInt(nb) + '</td>' +
             '<td class="num">' + fmtKm(km) + '</td><td class="num">' + part + ' %</td></tr>';
    }).join('');
    document.getElementById('visuals').innerHTML =
      vcard('c21a', 'Vélos par marque', 'parc') +
      vcard('c21b', 'Kilomètres par marque', 'part du total', donutOverlay(fmtKm(agg.km), 'kilomètres')) +
      vcard('c21c', 'Km mensuels — top marques', 'km empilés') +
      '<div class="vcard"><div class="v-head"><span class="v-title">Détail par marque (top 10)</span>' +
      '<span class="v-sub">période filtrée</span></div>' +
      '<div style="flex:1;min-height:0;overflow:auto;">' +
      '<table class="vtable"><thead><tr><th>Marque</th><th style="text-align:right;">Vélos</th>' +
      '<th style="text-align:right;">Km</th><th style="text-align:right;">Part</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
    renderCharts([
      ['c21a', hbarOpt(marques, marques.map(m => MARQUE_VELOS[m]))],
      ['c21b', donutOpt(topKmItems)],
      ['c21c', stackBarOpt(agg.mLabels, agg.marqKmM.slice(0, 5))]
    ]);
  }
};

/* =====================================================================
   RENDU — navigation, info popover, badge filtres, page active
   ===================================================================== */
function renderNav(){
  document.getElementById('navL1').innerHTML = NAV.map((p, i) =>
    '<div class="flex-1 py-2.5 px-4 rounded-lg text-xs text-center ' +
    (i === state.page
      ? 'font-semibold shadow-sm cursor-default" style="background:var(--primary);color:var(--surface);'
      : 'font-medium cursor-pointer shadow-sm" style="background:var(--surface);color:var(--text-secondary);border:1px solid var(--border);') +
    '" onclick="go(' + i + ',0)">' + p.name + '</div>').join('');
  document.getElementById('navL2').innerHTML = NAV[state.page].subs.map((s, i) =>
    '<span class="' + (i === state.sub
      ? 'font-semibold cursor-default" style="font-size:12px;color:var(--primary);border-bottom:2px solid var(--primary);padding-bottom:4px;'
      : 'font-medium cursor-pointer" style="font-size:12px;color:var(--text-secondary);padding-bottom:4px;') +
    '" onclick="go(' + state.page + ',' + i + ')">' + s.name + '</span>').join('');
}
function renderInfo(){
  const p = NAV[state.page];
  document.getElementById('infoPopover').innerHTML =
    '<h3>' + p.name + '</h3><p class="pdesc">' + p.desc + '</p>' +
    p.subs.map((s, i) =>
      '<div class="sub-item"><span class="dot' + (i === state.sub ? ' active' : '') + '"></span>' +
      '<div><div class="sub-name' + (i === state.sub ? ' active' : '') + '">' + s.name + '</div>' +
      '<div class="sub-desc">' + s.desc + '</div></div></div>').join('');
}
function updateBadge(){
  document.getElementById('fBadge').textContent = isFiltered() ? '● Filtres actifs' : '';
}
function renderPage(){
  const agg = aggregates();
  renderNav();
  renderInfo();
  updateBadge();
  disposeCharts();
  VIEWS[NAV[state.page].subs[state.sub].view](agg);
}

/* =====================================================================
   FILTRES FONCTIONNELS — chaque slicer pilote FILT puis renderPage()
   ===================================================================== */
function monthToDateStr(i){
  const m = MONTH_META[i];
  return m.year + '-' + String(m.month).padStart(2, '0') + '-01';
}
function dateStrToMonth(v){
  const d = new Date(v);
  if (isNaN(d)) return null;
  for (let i = 0; i < N_MONTHS; i++)
    if (MONTH_META[i].year === d.getFullYear() && MONTH_META[i].month === d.getMonth() + 1) return i;
  return null;
}
function syncRangeUI(){
  document.getElementById('rgS').value = FILT.start;
  document.getElementById('rgE').value = FILT.end;
  document.getElementById('dtS').value = monthToDateStr(FILT.start);
  document.getElementById('dtE').value = monthToDateStr(FILT.end);
  const f = document.getElementById('rgFill');
  f.style.left  = (FILT.start / (N_MONTHS - 1) * 100) + '%';
  f.style.width = ((FILT.end - FILT.start) / (N_MONTHS - 1) * 100) + '%';
}
function initFilters(){
  /* Années — chiclets multi-sélection */
  const years = [];
  MONTH_META.forEach(m => { if (years.indexOf(m.year) < 0) years.push(m.year); });
  const yc = document.getElementById('yearChics');
  yc.innerHTML = years.map(y => '<span class="chic" data-year="' + y + '">' + y + '</span>').join('');
  yc.querySelectorAll('.chic').forEach(el => el.addEventListener('click', () => {
    const y = +el.dataset.year;
    if (FILT.years.has(y)) { FILT.years.delete(y); el.classList.remove('active'); }
    else { FILT.years.add(y); el.classList.add('active'); }
    renderPage();
  }));
  /* Trimestre / Mois — mutuellement exclusifs */
  document.getElementById('selQ').addEventListener('change', e => {
    FILT.quarter = +e.target.value;
    if (FILT.quarter) { FILT.month = 0; document.getElementById('selM').value = '0'; }
    renderPage();
  });
  const selM = document.getElementById('selM');
  selM.innerHTML = '<option value="0">Tous</option>' +
    MOIS.map((m, i) => '<option value="' + (i + 1) + '">' + m + '</option>').join('');
  selM.addEventListener('change', e => {
    FILT.month = +e.target.value;
    if (FILT.month) { FILT.quarter = 0; document.getElementById('selQ').value = '0'; }
    renderPage();
  });
  /* Plage de dates — slider + champs synchronisés */
  const rgS = document.getElementById('rgS'), rgE = document.getElementById('rgE');
  rgS.max = rgE.max = N_MONTHS - 1;
  rgS.addEventListener('input', () => {
    FILT.start = Math.min(+rgS.value, FILT.end); syncRangeUI(); renderPage();
  });
  rgE.addEventListener('input', () => {
    FILT.end = Math.max(+rgE.value, FILT.start); syncRangeUI(); renderPage();
  });
  document.getElementById('dtS').addEventListener('change', e => {
    const i = dateStrToMonth(e.target.value); if (i === null) return;
    FILT.start = Math.min(i, FILT.end); syncRangeUI(); renderPage();
  });
  document.getElementById('dtE').addEventListener('change', e => {
    const i = dateStrToMonth(e.target.value); if (i === null) return;
    FILT.end = Math.max(i, FILT.start); syncRangeUI(); renderPage();
  });
  /* Effacer */
  document.getElementById('btnClear').addEventListener('click', () => {
    FILT.years.clear(); FILT.quarter = 0; FILT.month = 0;
    FILT.start = 0; FILT.end = N_MONTHS - 1;
    document.getElementById('selQ').value = '0';
    document.getElementById('selM').value = '0';
    yc.querySelectorAll('.chic').forEach(el => el.classList.remove('active'));
    syncRangeUI();
    renderPage();
  });
  syncRangeUI();
}

/* ---------- Mise à l'échelle du canevas 1920×1080 ---------- */
function fit(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  const sl = document.getElementById('slide');
  sl.style.transform = 'translate(' + ((window.innerWidth - 1920 * s) / 2) + 'px,' +
                       ((window.innerHeight - 1080 * s) / 2) + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fit);

/* ---------- Démarrage ---------- */
initFilters();
fit();
renderPage();
</script>
