<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>VELOH — Pilotage de flotte cyclable</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#B69E7F; --surface:#FFFFFF; --canvas:#F1F5F9; --card-bg:#FFFFFF; --border:#CBD5E1;
  --text-primary:#0F172A; --text-secondary:#64748B; --on-primary:#FFFFFF;
}
*{margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0b1220;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;background:var(--canvas);box-shadow:0 0 60px rgba(0,0,0,.5)}

.logo-zone{position:absolute;left:0;top:0;width:320px;height:97px;background:var(--surface);
  clip-path:polygon(0 0,320px 0,244px 97px,0 97px);
  display:flex;align-items:center;justify-content:center;padding-right:36px;z-index:2;box-sizing:border-box}
.logo-zone img{max-height:70px;max-width:230px;object-fit:contain}
.banner{position:absolute;left:0;top:0;right:0;height:97px;background:var(--primary);
  clip-path:polygon(342px 0,100% 0,100% 97px,267px 97px);z-index:1}
.head-title{position:absolute;left:360px;right:48px;top:0;height:97px;z-index:3;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--on-primary)}
.head-title h1{font-size:26px;font-weight:700;letter-spacing:.02em}
.head-title p{font-size:13px;opacity:.92;margin-top:2px}

.info-wrap{position:absolute;top:30px;right:18px;z-index:70}
.info-ico{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:18px;font-weight:700;
  cursor:help;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.info-ico:focus{outline:2px solid var(--primary);outline-offset:2px}
.popover{position:absolute;top:44px;right:0;width:400px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:16px;display:none;z-index:80;box-sizing:border-box}
.info-wrap:hover .popover,.info-wrap:focus-within .popover{display:block}
.pop-page{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--primary)}
.pop-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.pop-desc{font-size:11px;color:var(--text-secondary);margin-top:6px;line-height:1.4}
.pop-divider{height:1px;background:var(--border);margin:10px 0}
.pop-row{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:8px;cursor:pointer}
.pop-row:hover{background:var(--canvas)}
.pop-row.act{background:var(--canvas)}
.pop-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;border:1px solid var(--primary);background:transparent}
.pop-row.act .pop-dot{background:var(--primary)}
.pop-row-name{font-size:12px;font-weight:600;color:var(--text-primary)}
.pop-row.act .pop-row-name{color:var(--primary)}
.pop-row-desc{font-size:11px;color:var(--text-secondary);margin-top:1px;line-height:1.35}

.filters{position:absolute;left:11px;top:116px;bottom:40px;width:235px;background:var(--surface);
  border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:16px;
  display:flex;flex-direction:column;gap:12px;box-sizing:border-box;z-index:5}
.filters-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--primary);
  padding-bottom:10px;border-bottom:1px solid var(--border)}
.fi{width:15px;height:15px;flex-shrink:0}
.filt-badge{margin-left:auto;font-size:10px;font-weight:700;color:#B45309;background:#FEF3C7;border:1px solid #FDE68A;border-radius:6px;padding:2px 6px;white-space:nowrap}
.filters-body{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow-y:auto}
.filt-group{display:flex;flex-direction:column;gap:8px}
.filt-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)}
.chiclet-row{display:flex;flex-wrap:wrap;gap:6px}
.chiclet{height:32px;box-sizing:border-box;padding:0 10px;display:flex;align-items:center;
  font-size:12px;font-weight:500;border-radius:8px;background:var(--canvas);border:1px solid var(--border);
  color:var(--text-secondary);cursor:pointer;user-select:none}
.chiclet.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.dd{position:relative}
.dd-btn{height:32px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;font-size:12px;font-weight:500;color:var(--text-primary);background:var(--card-bg);
  border:1px solid var(--border);border-radius:8px;cursor:pointer}
.dd-btn .chev{color:var(--text-secondary);font-size:10px}
.dd-list{position:absolute;top:36px;left:0;right:0;background:var(--card-bg);border:1px solid var(--border);
  border-radius:8px;max-height:190px;overflow:auto;display:none;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.dd-list.open{display:block}
.dd-item{padding:8px 10px;font-size:12px;color:var(--text-primary);cursor:pointer}
.dd-item:hover{background:var(--canvas)}
.dd-item.sel{color:var(--primary);font-weight:600}
.period{display:flex;flex-direction:column;gap:8px}
.range-track{position:relative;height:16px;display:flex;align-items:center}
.range-fill{position:absolute;height:4px;border-radius:2px;background:var(--primary)}
.range-h{position:absolute;left:0;top:0;width:100%;height:16px;-webkit-appearance:none;appearance:none;
  background:transparent;margin:0;pointer-events:none}
.range-h::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--surface);border:2px solid var(--primary);pointer-events:auto;cursor:pointer}
.range-fields{display:flex;gap:8px}
.inp{flex:1;min-width:0;height:32px;box-sizing:border-box;padding:0 8px;font-size:12px;
  border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--text-primary)}
.reset-btn{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;font-size:12px;font-weight:500;
  color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);border-radius:8px;
  cursor:pointer;margin-top:auto;user-select:none}
.reset-btn:hover{color:var(--text-primary);border-color:var(--primary)}
.ri{width:14px;height:14px;flex-shrink:0}

.content{position:absolute;left:262px;top:97px;right:0;bottom:40px;
  padding:8px 20px 0 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.nav-l1{display:flex;gap:12px;width:100%}
.pill-l1{flex:1;height:34px;box-sizing:border-box;padding:9px 16px;border-radius:8px;text-align:center;
  font-size:12px;font-weight:500;background:var(--surface);border:1px solid var(--border);
  color:var(--text-secondary);cursor:pointer;transition:background .15s}
.pill-l1:hover{background:var(--canvas)}
.pill-l1.act{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600;cursor:default}
.nav-l2{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border);height:32px;box-sizing:border-box}
.l2{font-size:12px;color:var(--text-secondary);font-weight:500;cursor:pointer;padding-bottom:7px;box-sizing:border-box;border-bottom:2px solid transparent}
.l2:hover{color:var(--text-primary)}
.l2.act{color:var(--primary);font-weight:600;border-bottom-color:var(--primary);cursor:default}

.kpis{display:flex;gap:12px;height:130px}
.kpi{flex:1;position:relative;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05);box-sizing:border-box}
.kpi-acc{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
.kpi-acc.consol{background:#F59E0B}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:90px}
.kpi-value{font-size:28px;font-weight:700;color:var(--text-primary);margin:2px 0;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--text-secondary)}
.kpi-foot{min-height:22px;display:flex;align-items:center;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid}
.consol-flag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;padding:2px 6px;border-radius:6px}

.visuals{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;flex:1;min-height:0}
.cell{min-height:0;display:flex}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px;
  display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.05);flex:1;min-height:0;box-sizing:border-box}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;
  border-bottom:1px solid var(--border);padding-bottom:6px;gap:12px}
.card-title{font-size:13px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:11px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
.chart-holder{position:relative;flex:1;min-height:0}
.chart{position:absolute;inset:0}
.donut-center{position:absolute;left:35%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;pointer-events:none;line-height:1;text-align:center}
.dc-value{font-size:22px;font-weight:700;color:var(--text-primary)}
.dc-sub{font-size:11px;color:var(--text-secondary);margin-top:4px}
.tbl-wrap{flex:1;min-height:0;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl thead th{background:var(--primary);color:var(--on-primary);font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;padding:8px 10px;text-align:left;position:sticky;top:0;white-space:nowrap}
.tbl tbody td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-primary);font-size:12px;white-space:nowrap}
.tbl tbody tr.odd td{background:var(--canvas)}
.tbl td.num{text-align:right;font-family:ui-monospace,SFMono-Regular,monospace}

.foot{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text-secondary);background:var(--canvas);border-top:1px solid var(--border)}
</style>
</head>

function pad(n){ return String(n).padStart(2, '0'); }
const LBL_OVERRIDES = {Depasse: 'Dépassé', Liege: 'Liège', Montreal: 'Montréal', Quebec: 'Québec'};

function fInt(n){ return Math.round(n).toLocaleString('fr-FR'); }

function fDur(min){
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  if (h === 0) return m + ' min';
  if (m === 60) return (h + 1) + ' h 00';
  return h + ' h ' + pad(m);
}

function hexToHsl(hex){
  const h = hex.replace('#', ''); const r = parseInt(h.substr(0,2),16)/255,
    g = parseInt(h.substr(2,2),16)/255, b = parseInt(h.substr(4,2),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let hh, s, l = (mx+mn)/2;
  if (mx === mn){ hh = 0; s = 0; } else {
    const d = mx - mn; s = l > 0.5 ? d/(2-mx-mn) : d/(mx+mn);
    switch (mx){ case r: hh = (g-b)/d + (g < b ? 6 : 0); break; case g: hh = (b-r)/d + 2; break; default: hh = (r-g)/d + 4; }
    hh *= 60;
  }
  return [hh, s*100, l*100];
}
function hslToHex(h,s,l){
  s /= 100; l /= 100; const k = n => (n + h/30) % 12, a = s * Math.min(l, 1-l),
    f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1))),
    tx = x => Math.round(x*255).toString(16).padStart(2,'0');
  return '#' + tx(f(0)) + tx(f(8)) + tx(f(4));
}
function derivePalette(primary){
  const [h,s,l] = hexToHsl(primary);
  return [
    primary,
    hslToHex(h, s, Math.max(15, l-18)),
    hslToHex(h, Math.max(10, s-12), Math.min(92, l+15)),
    hslToHex((h+28)%360, Math.max(18, s-8), Math.min(62, l)),
    hslToHex((h+180)%360, Math.max(14, s-22), Math.min(55, l)),
    hslToHex(h, Math.max(8, s-28), l)
  ];
}
function relLum(hex){
  const h = hex.replace('#','');
  const c = [parseInt(h.substr(0,2),16)/255, parseInt(h.substr(2,2),16)/255, parseInt(h.substr(4,2),16)/255]
    .map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function contrast(a, b){
  const L1 = relLum(a), L2 = relLum(b);
  return (Math.max(L1,L2) + 0.05) / (Math.min(L1,L2) + 0.05);
}

function yearSeries(arr, year){

function yearRatio(num, den, year){
  const out = new Array(12).fill(null);
  for (let i = 0; i < N_MONTHS; i++){ const m = MONTH_META[i]; if (m.year === year && den[i]) out[m.month-1] = num[i]/den[i]; }

function sumI(arr, idx){ let s = 0; for (let i = 0; i < idx.length; i++) s += arr[idx[i]]; return s; }
function sumDimN(dimObj){
  const out = {};
  for (const k in dimObj) out[k] = sumI(dimObj[k], N_IDX);
  return out;
}

  const out = {};
  for (const k in dimObj) out[k] = sumI(dimObj[k], P_IDX);

}
function topBars(dict, topN){
  const arr = Object.keys(dict).map(k => ({name: k, value: dict[k]})).sort((a,b) => b.value - a.value);
  const head = arr.slice(0, topN);
  const rest = arr.slice(topN).reduce((s,d) => s + d.value, 0);
  if (rest > 0) head.push({name: 'Autres', value: rest});
  return head;
}
function donutItems(dict){
  const arr = Object.keys(dict).map(k => ({name: k, value: dict[k]})).sort((a,b) => b.value - a.value);
  const head = arr.slice(0, 6);
  const rest = arr.slice(6).reduce((s,d) => s + d.value, 0);
  if (rest > 0) head.push({name: 'Autres', value: rest});
  return head;
}

const N_YEAR_BITS = N_IDX.reduce((b,i) => b | (1 << i), 0);
const P_YEAR_BITS = P_IDX.reduce((b,i) => b | (1 << i), 0);
const agg = (() => {
  let cActifs = 0, pActifs = 0;
  for (const k in USER_MASKS){ const m = USER_MASKS[k]; if (m & N_YEAR_BITS) cActifs++; if (m & P_YEAR_BITS) pActifs++; }
  return {
    cKm: sumI(KM, N_IDX), pKm: sumI(KM, P_IDX),
    cRides: sumI(RIDES, N_IDX), pRides: sumI(RIDES, P_IDX),
    cMin: sumI(MINUTES, N_IDX), pMin: sumI(MINUTES, P_IDX),
    cActifs: cActifs, pActifs: pActifs
  };
})();

function dynTrend(kind){
  let c, p;
  switch (kind){
    case 'km': c = agg.cKm; p = agg.pKm; break;
    case 'rides': c = agg.cRides; p = agg.pRides; break;
    case 'min': c = agg.cMin; p = agg.pMin; break;
    case 'dur': c = agg.cMin/agg.cRides; p = agg.pMin/agg.pRides; break;
    case 'actifs': c = agg.cActifs; p = agg.pActifs; break;
    case 'kmCyc': c = agg.cKm/agg.cActifs; p = agg.pKm/agg.pActifs; break;
    case 'cycPays': c = agg.cActifs/SCALARS.NB_PAYS; p = agg.pActifs/SCALARS.NB_PAYS; break;
    default: return null;
  }
  if (!p) return null;
  const v = (c - p) / p * 100;
  return Number.isFinite(v) ? v : null;
}
function badgeHtml(kind){
  const v = dynTrend(kind);
  if (v === null) return '';
  let cls, txt;
  if (Math.abs(v) < 1){
    cls = 'bg-slate-100 text-slate-600 border-slate-200';
    txt = '≈ stable vs ' + PREV_YEAR;
  } else {
    cls = v >= 0 ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-rose-100 text-rose-800 border-rose-200';
    txt = (v >= 0 ? '+' : '−') + Math.abs(v).toLocaleString('fr-FR', {maximumFractionDigits: 1}) + ' % vs ' + PREV_YEAR;
  }
  return '<span class="badge ' + cls + '">' + txt + '</span>';
}

function monthDate(i, first){
  const m = MONTH_META[i];
  const day = first ? '01' : pad(new Date(m.year, m.month, 0).getDate());
  return day + '/' + pad(m.month) + '/' + m.year;
}
function buildPeriod(){
  const w = document.createElement('div');
  w.className = 'period';
  const track = document.createElement('div');
  track.className = 'range-track';
  const fill = document.createElement('div');
  fill.className = 'range-fill';
  const rMin = document.createElement('input');
  rMin.type = 'range'; rMin.min = '0'; rMin.max = String(N_MONTHS - 1); rMin.value = '0'; rMin.className = 'range-h';
  const rMax = document.createElement('input');
  rMax.type = 'range'; rMax.min = '0'; rMax.max = String(N_MONTHS - 1); rMax.value = String(N_MONTHS - 1); rMax.className = 'range-h';
  rMin.style.zIndex = '5';
  track.appendChild(fill);
  track.appendChild(rMin);
  track.appendChild(rMax);
  const fields = document.createElement('div');
  fields.className = 'range-fields';
  const dFrom = document.createElement('input');
  dFrom.className = 'inp'; dFrom.value = DEF_FROM; dFrom.setAttribute('maxlength', '10');
  const dTo = document.createElement('input');
  dTo.className = 'inp'; dTo.value = DEF_TO; dTo.setAttribute('maxlength', '10');
  fields.appendChild(dFrom);
  fields.appendChild(dTo);
  w.appendChild(track);
  w.appendChild(fields);
  function idxOf(input){ return Math.min(N_MONTHS - 1, Math.max(0, +input.value)); }
  function syncFromSlider(){
    let a = idxOf(rMin), b = idxOf(rMax);
    if (a > b){ const t = a; a = b; b = t; rMin.value = String(a); rMax.value = String(b); }
    fill.style.left = (a / (N_MONTHS - 1) * 100) + '%';
    fill.style.width = ((b - a) / (N_MONTHS - 1) * 100) + '%';
    FILT.drFrom = monthDate(a, true);
    FILT.drTo = monthDate(b, false);
    dFrom.value = FILT.drFrom;
    dTo.value = FILT.drTo;
  }
  rMin.oninput = syncFromSlider;
  rMax.oninput = syncFromSlider;
  rMin.onpointerdown = function(){ rMin.style.zIndex = '5'; };
  rMax.onpointerdown = function(){ rMin.style.zIndex = '3'; };
  function applyFromField(inp, isFrom){
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(inp.value);
    if (!m) return;
    const mo = +m[2], y = +m[3];
    if (mo < 1 || mo > 12) return;
    let idx = (y - 2024) * 12 + (mo - 1);
    idx = Math.min(N_MONTHS - 1, Math.max(0, idx));
    if (isFrom){ FILT.drFrom = monthDate(idx, true); rMin.value = String(idx); }
    else { FILT.drTo = monthDate(idx, false); rMax.value = String(idx); }
    syncFromSlider();
  }
  dFrom.onchange = function(){ applyFromField(dFrom, true); syncBadge(); };
  dTo.onchange = function(){ applyFromField(dTo, false); syncBadge(); };
  syncFromSlider();
  resetFns.push(function(){ rMin.value = '0'; rMax.value = String(N_MONTHS - 1); rMin.style.zIndex = '5'; syncFromSlider(); });
  return w;
}

  body.appendChild(gYears);
  const gQ = group('Trimestre');
  const qRow = chicletOne(['T1','T2','T3','T4'], () => FILT.quarter, function(o){
    FILT.quarter = FILT.quarter === o ? null : o;
    if (FILT.quarter !== null){ FILT.month = null; if (monthTxtSpan) monthTxtSpan.textContent = 'Toutes'; }
  });
  quarterEls = Array.prototype.slice.call(qRow.children);
  quarterEls.forEach(c => { c._v = c.textContent; });
  gQ.appendChild(qRow);
  body.appendChild(gQ);
  const gM = group('Mois');
  gM.appendChild(dropdown(MONTH_LBL, () => FILT.month, function(o){
    FILT.month = o;
    if (FILT.month !== null) FILT.quarter = null;
    refreshQuarters();
  }));
  body.appendChild(gM);
  const gP = group('Période');
  gP.appendChild(buildPeriod());
  body.appendChild(gP);
  const gPay = group('Pays');
  gPay.appendChild(chicletMulti(Object.keys(PAYS_CYCLISTES).sort(), () => FILT.pays, function(o){
    const i = FILT.pays.indexOf(o);
    if (i >= 0) FILT.pays.splice(i, 1); else FILT.pays.push(o);
  }));
  body.appendChild(gPay);
  const gV = group('Ville');
  gV.appendChild(dropdown(Object.keys(VILLE_CYCLISTES).sort(), () => FILT.ville, function(o){ FILT.ville = FILT.ville === o ? null : o; }));
  body.appendChild(gV);
  const gMq = group('Marque');
  gMq.appendChild(dropdown(Object.keys(MARQUE_VELOS).sort(), () => FILT.marque, function(o){ FILT.marque = FILT.marque === o ? null : o; }));
  body.appendChild(gMq);
  const gS = group('Statut');
  gS.appendChild(chicletMulti(['OK','Alerte','Critique','Depasse'], () => FILT.statut, function(o){
    const i = FILT.statut.indexOf(o);
    if (i >= 0) FILT.statut.splice(i, 1); else FILT.statut.push(o);
  }));
  body.appendChild(gS);
  body.appendChild(buildReset());
  syncBadge();
}

function fit(){
  const w = window.innerWidth, h = window.innerHeight;
  const s = Math.min(w / 1920, h / 1080);
  const el = document.getElementById('slide');
  el.style.transform = 'translate(' + ((w - 1920 * s) / 2) + 'px,' + ((h - 1080 * s) / 2) + 'px) scale(' + s + ')';
}
window.addEventListener('resize', fit);
buildPane();
fit();
renderPage();
</script>
</body>
</html>
